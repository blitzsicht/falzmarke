[project]
name = "normbrief"
version = "0.2.0"
description = "Geschäftsbriefe nach DIN 5008 aus Markdown — mit nachgemessener Geometrie"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Blitzsicht", email = "servus@blitzsicht.com" }]
keywords = ["din5008", "brief", "letter", "typst", "pdf", "markdown", "geschaeftsbrief"]
dependencies = [
    "typst>=0.15,<0.16",
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "markdown-it-py>=4,<5",
]

[project.urls]
Homepage = "https://github.com/blitzsicht/normbrief"
Issues = "https://github.com/blitzsicht/normbrief/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "fonttools>=4"]

[project.scripts]
normbrief = "normbrief.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Das Paket liegt unter skill/, weil derselbe Ordner als Claude-Skill
# ausgeliefert wird. Zwei Kopien wären zwei Fassungen.
[tool.setuptools]
package-dir = { "" = "skill" }
packages = ["normbrief"]

[tool.setuptools.package-data]
normbrief = ["typst/**/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
