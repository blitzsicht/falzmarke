[project]
name = "falzmarke"
version = "0.5.1"
description = "Geschäftsbriefe nach DIN 5008 aus Markdown — mit nachgemessener Geometrie"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Blitzsicht", email = "servus@blitzsicht.com" }]
keywords = ["din5008", "brief", "letter", "typst", "pdf", "markdown", "geschaeftsbrief"]
dependencies = [
    "typst>=0.15,<0.16",
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "markdown-it-py>=4,<5",
]

[project.urls]
Homepage = "https://github.com/blitzsicht/falzmarke"
Issues = "https://github.com/blitzsicht/falzmarke/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "fonttools>=4"]

[project.scripts]
falzmarke = "falzmarke.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Das Paket liegt unter skill/, weil derselbe Ordner als Claude-Skill
# ausgeliefert wird. Zwei Kopien wären zwei Fassungen.
[tool.setuptools]
package-dir = { "" = "skill" }
packages = ["falzmarke", "falzmarke.regeln"]

[tool.setuptools.package-data]
falzmarke = ["typst/**/*", "assets/**/*"]
# Die Quellenlage gehört ins Paket — ohne sie fällt der Linter mit
# „Regeldatei fehlt“ um. Gemessen am 25.08.2026: setuptools nimmt das
# Unterpaket auch ohne diese beiden Einträge mit. Sie stehen trotzdem hier,
# weil das Verhalten dann von einer Voreinstellung abhängt statt von einer
# Angabe — und weil `packages` sonst unvollständig ist.
"falzmarke.regeln" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
