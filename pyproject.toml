[project]
name = "falzmarke"
version = "0.9.1"
description = "Am fertigen PDF nachgemessen: DIN-5008-Briefe aus Markdown. Sollwerte aus Sekundärquellen."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Blitzsicht", email = "servus@blitzsicht.com" }]
keywords = ["din5008", "brief", "letter", "typst", "pdf", "markdown", "geschaeftsbrief",
            "skill", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typst>=0.15,<0.16",
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "markdown-it-py>=4,<5",
    # Kam bisher schon mit pdfplumber; seit Issue #154 wird es direkt benutzt
    # (falzmarke/farbe.py misst das Signaturlogo). Eine Abhaengigkeit, auf die
    # man sich verlaesst, gehoert genannt — sonst haengt sie daran, dass ein
    # anderes Paket sie zufaellig weiter mitbringt.
    "pillow>=10",
]

[project.urls]
# Homepage zeigt auf die Website, nicht auf das Repository. Auf PyPI ist das der
# prominenteste Link der Projektseite, und er ging bisher dorthin, wo ohnehin
# schon fuenf andere hinzeigen. Wer ueber PyPI kommt, sucht meist keine
# Quelltexte, sondern eine Anleitung — die steht auf falzmarke.com.
#
# Wirkt erst mit dem naechsten Release: PyPI zieht die Metadaten aus dem
# hochgeladenen Paket, nicht aus dem Repository.
Homepage = "https://falzmarke.com"
Documentation = "https://falzmarke.com/anleitung/claude"
Source = "https://github.com/blitzsicht/falzmarke"
Changelog = "https://github.com/blitzsicht/falzmarke/blob/main/CHANGELOG.md"
Releases = "https://github.com/blitzsicht/falzmarke/releases"
Issues = "https://github.com/blitzsicht/falzmarke/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "fonttools>=4"]
# Der MCP-Dienst ist bewusst nicht in der Grundausstattung: Das SDK bringt
# 28 Pakete mit, darunter uvicorn, starlette, cryptography und opentelemetry.
# Ein Werkzeug, das offline Briefe setzt, schleppt die nicht mit.
# Ab 2.0: dort heisst die Serverklasse MCPServer. In 1.x war es FastMCP
# unter einem anderen Pfad — derselbe Code laeuft nicht auf beiden.
mcp = ["mcp>=2,<3"]

[project.scripts]
falzmarke = "falzmarke.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Das Paket liegt unter skill/, weil derselbe Ordner als Claude-Skill
# ausgeliefert wird. Zwei Kopien wären zwei Fassungen.
[tool.setuptools]
package-dir = { "" = "skill" }
packages = ["falzmarke", "falzmarke.regeln"]

[tool.setuptools.package-data]
falzmarke = ["typst/**/*", "assets/**/*"]
# Die Quellenlage gehört ins Paket — ohne sie fällt der Linter mit
# „Regeldatei fehlt“ um. Gemessen am 25.08.2026: setuptools nimmt das
# Unterpaket auch ohne diese beiden Einträge mit. Sie stehen trotzdem hier,
# weil das Verhalten dann von einer Voreinstellung abhängt statt von einer
# Angabe — und weil `packages` sonst unvollständig ist.
"falzmarke.regeln" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
