[project]
name = "falzmarke"
version = "0.6.0"
description = "DIN-5008-Briefe aus Markdown, am fertigen PDF nachgemessen. Sollwerte aus Sekundärquellen."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Blitzsicht", email = "servus@blitzsicht.com" }]
keywords = ["din5008", "brief", "letter", "typst", "pdf", "markdown", "geschaeftsbrief",
            "skill", "cli", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typst>=0.15,<0.16",
    "pyyaml>=6",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "markdown-it-py>=4,<5",
]

[project.urls]
Homepage = "https://github.com/blitzsicht/falzmarke"
Documentation = "https://github.com/blitzsicht/falzmarke#readme"
Source = "https://github.com/blitzsicht/falzmarke"
Changelog = "https://github.com/blitzsicht/falzmarke/blob/main/CHANGELOG.md"
Releases = "https://github.com/blitzsicht/falzmarke/releases"
Issues = "https://github.com/blitzsicht/falzmarke/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "fonttools>=4"]

[project.scripts]
falzmarke = "falzmarke.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Das Paket liegt unter skill/, weil derselbe Ordner als Claude-Skill
# ausgeliefert wird. Zwei Kopien wären zwei Fassungen.
[tool.setuptools]
package-dir = { "" = "skill" }
packages = ["falzmarke", "falzmarke.regeln"]

[tool.setuptools.package-data]
falzmarke = ["typst/**/*", "assets/**/*"]
# Die Quellenlage gehört ins Paket — ohne sie fällt der Linter mit
# „Regeldatei fehlt“ um. Gemessen am 25.08.2026: setuptools nimmt das
# Unterpaket auch ohne diese beiden Einträge mit. Sie stehen trotzdem hier,
# weil das Verhalten dann von einer Voreinstellung abhängt statt von einer
# Angabe — und weil `packages` sonst unvollständig ist.
"falzmarke.regeln" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
