# Die Regeln des Datenvertrags `typ: rechnung` (#115).
#
# Eigene Datei und nicht in `email.yaml` oder `din5008.yaml`: Der Gegenstand ist
# ein anderer. `din5008.yaml` beschreibt die Norm des Briefbogens, `email.yaml`
# die E-Mail-Fassung — eine Rechnung hat Felder, die in keinem von beiden
# vorkommen. Wie `email.yaml` trägt jede Regel eine `ebene` (ADR 0035).
#
# ── Warum alle fünf auf `werkzeug` stehen ──────────────────────────────────
#
# Die Felder leiten sich aus § 14 Absatz 4 UStG ab — erhoben in #113 und belegt
# in `docs/recht.md`. Die WIRKUNG ist trotzdem eine Aussage über den
# Datenvertrag, nicht über das Steuerrecht: Dass falzmarke eine Rechnung ohne
# Nummer nicht setzt, sagt nichts darüber, ob sie steuerlich wirksam wäre.
# `herkunft: primaerquelle` mit `ebene: werkzeug` wäre ein Widerspruch in sich;
# die Herleitung aus dem UStG steht deshalb in der `bemerkung`, nicht in
# `quellen`.
#
# ── Was hier NICHT steht ───────────────────────────────────────────────────
#
# Keine Prüfung des Steuersatzes gegen § 12 UStG — die Vorschrift ist nicht
# erhoben, und eine Regel ohne Beleg wird nicht erfunden. Kein Nachrechnen des
# Steuerbetrags je Satz (ADR 0039).

regeln:

  - id: rechnung.nummer
    titel: Die Rechnungsnummer ist nicht leer
    lint: rechnung.nummer
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 4 UStG verlangt „eine fortlaufende Nummer … die zur
      Identifizierung der Rechnung vom Rechnungsaussteller einmalig vergeben
      wird". falzmarke vergibt keine (ADR 0039) und prüft keine Fortlaufendheit —
      es kennt die vorige Rechnung nicht. Geprüft wird nur, dass eine dasteht.

  - id: rechnung.leistung
    titel: Leistungsdatum oder Leistungszeitraum, nicht beides
    lint: rechnung.leistung
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 6 UStG verlangt den „Zeitpunkt der Lieferung oder
      sonstigen Leistung". Ein Zeitraum ist die Form, die eine Dauerleistung
      braucht. Beides zugleich ist widersprüchlich, und falzmarke wählt nicht
      für den Absender.

  - id: rechnung.zahlungsziel
    titel: Das Zahlungsziel ist ein Datum
    lint: rechnung.zahlungsziel
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Kein Pflichtfeld des UStG, aber ein Feld, das jede Rechnung in der Praxis
      trägt. Ein Datum und keine Frist in Tagen: „30 Tage" setzt einen
      Bezugspunkt voraus, den der Empfänger anders lesen kann als der Absender.

  - id: rechnung.position
    titel: Jede Position trägt Bezeichnung, Menge, Steuersatz und Betrag
    lint: rechnung.position
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 5 und 8 UStG verlangen „die Menge und die Art" sowie
      „den anzuwendenden Steuersatz". Der Betrag ist Pflicht, weil falzmarke ihn
      nicht bildet (ADR 0039). Ein unbekanntes Feld in einer Position wird
      gemeldet — Abnahme 2 aus #115: Ein Tippfehler bleibt nicht stumm.

      Zahlen stehen ohne Tausenderpunkt und mit Punkt als Dezimaltrenner:
      `1240.00`, nicht `1.240,00`. Die Schreibweise mit Tausenderpunkt ist die
      des gesetzten Schreibens; in der Quelle wäre sie mehrdeutig.

  - id: rechnung.summen
    titel: Positionen, Netto, Steuer und Brutto passen zueinander
    lint: rechnung.summen
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Die Rechenprobe über GEGEBENE Werte, die ADR 0039 erlaubt: Die Summe der
      Positionsbeträge gegen `netto`, und `netto` plus die Steuerbeträge gegen
      `brutto`. Sie bildet nichts und ersetzt nichts.

      Warnung und nie Fehler: ADR 0039 hält fest, dass eine Rechnung mit
      widersprüchlichen Summen durchgeht. Die Toleranz beträgt einen Cent je
      Steuersatz — so viel Abweichung entsteht, wenn je Satz gerundet wird.

      Nicht nachgerechnet wird der Steuerbetrag je Satz. Das wäre Satz mal
      Bemessungsgrundlage, und damit stünde die Rundungsregel zur Wahl, die der
      Absender verantwortet.

  - id: rechnung.aussteller
    titel: Das Profil trägt Name, Anschrift und Ländercode des Ausstellers
    lint: rechnung.aussteller
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 1 UStG verlangt „den vollständigen Namen und die
      vollständige Anschrift des leistenden Unternehmers". Sie stehen im Profil
      und nicht im einzelnen Schreiben — wie die übrigen Absenderangaben.

      Name, Straße, PLZ und Ort kommen aus `absender:`, das es schon gibt. Neu
      ist allein der Ländercode: Ein Brief braucht ihn nicht, die eingebettete
      XML nach EN 16931 schon. Er wird nicht auf `DE` geraten — was fehlt,
      fehlt sichtbar (#116).

  - id: rechnung.steuernummer
    titel: Das Profil trägt Steuernummer oder USt-IdNr.
    lint: rechnung.steuernummer
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 2 UStG verlangt „die dem leistenden Unternehmer vom
      Finanzamt erteilte Steuernummer oder die ihm vom Bundeszentralamt für
      Steuern erteilte Umsatzsteuer-Identifikationsnummer". Eine von beiden
      genügt; beide zugleich sind zulässig und werden nicht gemeldet.

      Geprüft wird nur, dass eine dasteht. Ob sie gilt, prüft falzmarke nicht —
      das verlangte einen Abgleich beim Bundeszentralamt, also Netz (ADR 0005).

  - id: rechnung.empfaenger
    titel: Die Anschrift des Empfängers steht in Feldern, nicht in freien Zeilen
    lint: rechnung.empfaenger
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      § 14 Absatz 4 Nummer 1 UStG verlangt „den vollständigen Namen und die
      vollständige Anschrift … des Leistungsempfängers". Im Brief steht sie
      unter `empfaenger:` als ein bis sechs freie Zeilen — das genügt für das
      Anschriftfeld im Fensterumschlag, aber nicht für die eingebettete XML.

      Ob die zweite Zeile die Straße ist oder eine zweite Namenszeile, lässt
      sich nicht sicher ablesen: „Muster GmbH / Frau Erika Muster /
      Musterstraße 1" und „Muster GmbH / Musterstraße 1 / 12345 Musterstadt"
      sehen gleich aus. Geraten hieße, den Empfänger falsch zu adressieren,
      ohne dass es auffällt — deshalb `empfaenger_anschrift:` mit `name`,
      `strasse`, `plz`, `ort` und `land`.

      Geprüft wird nur, wenn das Feld dasteht. Wer einen Brief setzt, braucht
      es nicht; wer eine XML erzeugt, bekommt ohne es eine Meldung statt einer
      Datei (#116).

  - id: rechnung.betrag_stellen
    titel: Beträge sind Zahlen mit höchstens zwei Nachkommastellen
    lint: rechnung.betrag_stellen
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die XML setzt Beträge zweistellig, Mengen und Einzelpreise vierstellig — so
      stehen sie in der Referenzdatei des fremden Prüfers. Trägt die Quelle mehr
      Stellen, müsste falzmarke runden: `1240.005` würde still `1240.01`, ein
      Wert, der so nie in der Quelle stand. Das ist Rechnen (ADR 0039), also
      wird gemeldet statt gerundet. Gefunden im Review von #116 am 13.09.2026.

      Dieselbe Regel meldet ein Summenfeld, das keine Zahl ist. Vorher lief ein
      Text dort still durch die Rechenprobe und brach erst beim Setzen ab.

      Geprüft wird zweimal: hier, damit die Meldung vor dem Setzen kommt, und
      im Emitter, weil der MCP-Dienst ohne `lint` setzt.

  # ── Kontakt, Zahlungsweg, elektronische Adresse (#117) ───────────────────

  - id: rechnung.iban
    titel: Die IBAN in rechnung.bank hat eine gültige Form und Prüfziffer
    lint: rechnung.iban
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die IBAN wird ohne Leerzeichen in die XML geschrieben (Zahlungsart 58,
      `IBANID`). Geprüft werden Ländercode, zwei Prüfziffern, Kontokennung und
      die Prüfziffer nach Modulo 97 — nicht, ob das Konto existiert (ADR 0005).

      Das Verfahren stammt aus ISO 13616 mit ISO/IEC 7064 (MOD 97-10). Beide
      Normen sind hier NICHT nachgelesen: Die frei zugängliche Beschreibung im
      SWIFT-IBAN-Register war am 13.09.2026 nicht erreichbar. Deshalb steht die
      Regel als Werkzeugregel und nicht als Primärquelle — nachzutragen, sobald
      eine Fundstelle gelesen ist. Die Sollwerte der Tests sind nicht aus der
      eigenen Implementierung gebildet: Die Beispiel-IBAN der Fußzeile und eine
      um eine Ziffer verfälschte Fassung.

      Dieselbe Prüfung steht im Emitter, weil der MCP-Dienst ohne `lint` setzt.

  - id: rechnung.iban_fusszeile
    titel: Die IBAN aus rechnung.bank steht auch in der Fußzeile
    lint: rechnung.iban_fusszeile
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Zwei Quellen derselben Angabe: Die Fußzeile ist die Fassung für Menschen,
      `rechnung.bank.iban` die für die XML. Nennen sie verschiedene Konten,
      überweist der Empfänger je nach Leseweg woandershin. Verglichen wird ohne
      Leerzeichen und ohne Groß-/Kleinschreibung.

      Warnung und nicht Fehler: Eine Fußzeile ohne Bankverbindung ist zulässig.

  - id: rechnung.adresse
    titel: rechnung.adresse im Profil ist eine E-Mail-Adresse
    lint: rechnung.adresse
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Die elektronische Adresse des Ausstellers (BT-34) mit dem Schema `EM`.
      XRechnung verlangt sie (#117); unter EN 16931 wird sie geschrieben, wenn
      sie dasteht. Dieselbe Formprüfung wie für `an:` (lint.adresse_grund).
    belegt_durch:
      rfc5322: "Abschnitt 3.4.1 — Addr-Spec Specification"

  # ── XRechnung (#117, Teil 2) ─────────────────────────────────────────────

  - id: rechnung.erechnung
    titel: erechnung ist en16931 oder xrechnung
    lint: rechnung.erechnung
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die Ausprägung der E-Rechnung. Ohne Angabe EN 16931 (ZUGFeRD-Profil
      EN 16931, ADR 0039); `xrechnung` erzeugt XRechnung 3.0 in CII (ADR 0040).
      Ein anderer Wert wird gemeldet, nicht auf eine der beiden geraten.

  - id: rechnung.referenz
    titel: Nicht leitweg_id und kaeuferreferenz zugleich
    lint: rechnung.referenz
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Beide gehen in dasselbe Feld, die Käuferreferenz BT-10. falzmarke wählt
      nicht für den Absender, welche gemeint ist.

  - id: rechnung.leitweg_id
    titel: Die Leitweg-ID hat die Form der Spezifikation und eine gültige Prüfziffer
    lint: rechnung.leitweg_id
    ebene: technik
    herkunft: primaerquelle
    quellen: [leitweg_id_202]
    wirkung: fehler
    bemerkung: >-
      Geprüft wird die Form, nicht der Inhalt: Ob die Behörde die ID kennt,
      hieße Netz (ADR 0005). Dieselbe Prüfung steht im Emitter, weil der
      MCP-Dienst ohne `lint` setzt. Für Buchstaben in der Feinadressierung
      liegt kein belegtes Beispiel vor; die Tests nutzen nur numerische.
    belegt_durch:
      leitweg_id_202: >-
        Abschnitt 2.1 (2–12 Stellen Grob-, bis 30 Stellen Feinadressierung),
        2.3 (A–Z und 0–9, nicht case-sensitiv), 2.4 (Prüfziffer nach
        ISO/IEC 7064:2003 Modulo 97-10, Rest 1 bei der Überprüfung), 2.5
        (Trennzeichen U+002D)

  - id: rechnung.empfaenger_adresse
    titel: empfaenger_anschrift.adresse ist eine E-Mail-Adresse
    lint: rechnung.empfaenger_adresse
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Die elektronische Adresse des Empfängers (BT-49) mit dem Schema `EM`.
    belegt_durch:
      rfc5322: "Abschnitt 3.4.1 — Addr-Spec Specification"

  - id: rechnung.xrechnung
    titel: Eine XRechnung trägt Käuferreferenz, Kontakt, Konto und beide elektronischen Adressen
    lint: rechnung.xrechnung
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die Liste folgt den Regeln, die Mustang 2.26.0 gegen XR_30 anwendet:
      BR-DE-15 (BT-10), BR-DE-2/5/6/7 (Kontakt), BR-DE-1/23 (Zahlungsweg mit
      Konto), Peppol R010/R020 (BT-49/BT-34). Die Schematron-Dateien der KoSIT
      sind hier nicht selbst gelesen — deshalb Werkzeugregel. Belegt ist die
      Wirkung am fremden Prüfer: Die eigene Beispiel-XRechnung besteht, dieselbe
      Datei ohne BT-10 fällt mit genau BR-DE-15 durch (CI-Job „E-Rechnung“).
      `lint` und Emitter lesen dieselbe Liste (`emit_xml.xrechnung_maengel`).

  # ── Beispiele, Goldens, Gegenproben (#119) ────────────────────────────────

  - id: rechnung.steuersatz
    titel: Jeder Positions-Steuersatz hat eine passende Zeile in summen.steuer
    lint: rechnung.steuersatz
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Der teure Fall aus #119: Die Positionstabelle im PDF zeigt nie den
      Steuersatz einer einzelnen Position — nur die Sammelzeilen aus
      `summen.steuer` als „Umsatzsteuer NN %" (`cli.py:_positionstabelle`).
      Trägt eine Position einen Satz, für den `summen.steuer` keine Zeile hat,
      verlässt dieser Satz die Quelle nur über die eingebettete XML: Ein PDF,
      das nur 19 % zeigt, und eine XML, die zusätzlich 7 % trägt, sehen beide
      richtig aus — bis die Buchhaltung des Empfängers die XML einliest.

      Verglichen werden GEGEBENE Werte, es wird nichts gerechnet (ADR 0039).
      Anders als bei `rechnung.summen` geht es nicht um eine Rundungstoleranz,
      sondern um eine ganz fehlende Zeile — deshalb Fehler statt Warnung.

  - id: rechnung.land
    titel: Ein Ländercode ist ein gültiger ISO-3166-1-Alpha-2-Code
    lint: rechnung.land
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Sowohl `rechnung.land` im Profil als auch `empfaenger_anschrift.land`
      wurden bis #119 nur auf Vorhandensein geprüft — `land: Deutschland`
      blieb unbeanstandet und landete unverändert als `<ram:CountryID>` in der
      eingebetteten XML. Geprüft wird gegen die amtlich vergebenen Codes
      (`emit_xml.LAENDERCODES`), nicht nur die Form „zwei Buchstaben".
