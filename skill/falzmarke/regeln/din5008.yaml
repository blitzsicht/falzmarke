# Quellenlage je Regel — die einzige Stelle, an der die Herkunft gepflegt wird.
#
# Warum es diese Datei gibt: Alle Maße und Schreibregeln in falzmarke stammen aus
# Sekundärquellen. Der Abgleich mit dem Originaltext der DIN 5008:2020-03 steht
# aus (Issue: Normabgleich). Bis dahin darf das Werkzeug nur als Fehler melden,
# was mehrfach belegt ist — und muss sagen, woher es das weiß.
#
# herkunft (genau einer):
#   mehrfach_bestaetigt  mindestens ZWEI Quellen mit `zaehlt: voll`
#   einzeln_belegt       mindestens eine Quelle mit `zaehlt: voll` oder `einzeln`
#   offen                Annahme ohne Beleg
#   werkzeug             keine Aussage der Norm, sondern eine Prüfung des
#                        Werkzeugs (siehe unten)
#
# Zu `werkzeug`: Der Auftrag sah drei Werte vor. Es gibt aber Regeln, die gar
# keine Normaussage treffen — ein Tabulator im Markdown, eine URL im Fließtext,
# ein Betreff, der über zwei Zeilen läuft. Sie als `offen` zu führen hieße, sie
# dürften nicht prüfen; sie als `einzeln_belegt` zu führen wäre eine
# Quellenbehauptung, die es nicht gibt. Deshalb der vierte Wert. Er wirkt wie
# `mehrfach_bestaetigt` (darf Fehler sein), sagt aber nichts über die Norm.
#
# wirkung: fehler | warnung | keine — was der Linter höchstens tun darf.
#   Der Linter stuft selbst herab: einzeln_belegt wird immer zur Warnung.
#
# Die Quellen stehen in `quellen.yaml`, die E-Mail-Regeln in `email.yaml`.
# Diese Datei traegt die Regeln, die sich auf die DIN 5008 berufen, und die
# Pruefungen des Werkzeugs, die gar keine Normaussage treffen.
#

regeln:

  # ── Geometrie, Form B ────────────────────────────────────────────────────
  - id: geometrie.form_b.briefkopf
    titel: Briefkopfhöhe Form B, 45 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        Bemaßt mit 45 mm von der oberen Blattkante bis zur Unterkante des mit
        „Feld für Briefkopf, Form B“ beschrifteten Felds.
    wirkung: fehler
    bemerkung: >-
      Nicht zu verwechseln mit den 50 mm, die der Wikipedia-Artikel für das
      Form-B-Anschriftfeld nennt: Das ist die Oberkante der Zusatz- und
      Vermerkzone, also die **Unterkante der Rücksendeangabe**, und liegt 5 mm
      tiefer als der Briefkopf. Der Artikel sagt es selbst — das Anschriftfeld
      sei „von 40 auf 45 mm vergrößert“ worden, um die Rücksendeangabe
      aufzunehmen, und es sei „9-zeilig: 3 Zeilen ZVZ, 6 Zeilen AZ“
      (12,7 + 27,3 = 40,0 → 40 + 5 = 45 → 45 + 5 = 50). Kein Widerspruch,
      andere Zählweise — siehe #345. Die 32 bzw. 50 mm stehen als Kante auch
      bei uns: `geometrie.py`, `ruecksende_zone` und `infoblock_oben`.

  - id: geometrie.form_b.anschriftfeld
    titel: Anschriftfeld 85 × 45 mm, linke Kante 20 mm, Text ab 25 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        85 mm Außenbreite und 45 mm Höhe bemaßt, linke Kante bei 20 mm. Der
        Textbeginn bei 25 mm steht als Innenbreite 80 mm daneben, markiert
        durch die gestrichelte Senkrechte: 20 + (85 − 80) = 25.
    wirkung: fehler

  - id: geometrie.form_b.zonen
    titel: Rücksendeangabe 5 mm, Zusatz-/Vermerkzone 12,7 mm, Anschriftzone 27,3 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        Trägt die Anschriftzone mit 27,3 mm und die Zone darüber mit 17,7 mm,
        beschriftet als „Zusatz- und Vermerkzone mit integrierter
        Rücksendeangabe“. Die Aufteilung dieser 17,7 mm in 5 + 12,7 zeigt sie
        nicht — dazu schweigt sie. Offene Frage 4 der Normabgleich-Prüfliste.
    wirkung: fehler
    bemerkung: >-
      Die Maßzeichnung fasst die ersten beiden zu 17,7 mm zusammen
      („Zusatz- und Vermerkzone mit integrierter Rücksendeangabe“).
      5 + 12,7 = 17,7 — dieselben Werte, feiner aufgelöst.

  - id: geometrie.form_b.infoblock
    titel: Informationsblock x = 125 mm, Breite 75 mm, Oberkante 50 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        Alle drei Werte bemaßt: 125 mm bis zur linken Kante, Breite 75 mm,
        Oberkante 50 mm. Das Restmaß 10 mm bis zur rechten Blattkante
        schließt die Zeile (125 + 75 + 10 = 210).
    wirkung: fehler
    bemerkung: >-
      Die 50 mm sind dieselbe Kante, die der Wikipedia-Artikel für das
      Form-B-Anschriftfeld nennt — Oberkante der Zusatz- und Vermerkzone. Hier
      entsteht die Verwechslung aus #345: Dieselbe Zahl meint bei uns die
      Oberkante des Informationsblocks, dort den Beginn des Anschriftfelds.
      Beides trifft zu, es ist eine Linie.

  - id: geometrie.form_b.falzmarken
    titel: Falzmarken bei 105 und 210 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        Faltmarke 1 bei 105 mm bemaßt und beschriftet. Die zweite Marke steht
        als weitere 105 mm darunter (105 + 105 = 210); das Restmaß 87 mm bis
        zur unteren Blattkante bestätigt die Lage.
    wirkung: fehler

  # ── Geometrie, Form A ────────────────────────────────────────────────────
  - id: geometrie.form_a.masse
    titel: Form A — Briefkopf 27 mm, Anschriftfeld ab 27 mm, Falzmarken 87 / 192 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_a, federwerk, koma_script, letter_pro, dinbrief]
    belegt_durch:
      massskizze_a: >-
        Eigene Form-A-Zeichnung im selben Artikel, Bezugsnorm DIN 5008:2020.
        Abgelesen und nachgerechnet: Briefkopf und Anschriftfeld ab 27 mm,
        Anschriftzone 20 mm von links und 45 mm hoch, Faltmarke 1 bei 87 mm,
        Lochmarke bei 148,5 mm, von dort 105 mm bis Faltmarke 2 (= 192 mm) und
        nochmals 105 mm bis zur Blattkante. 87 + 105 + 105 = 297 mm — die
        Bemaßung geht auf A4 auf, was ein Ablesefehler nicht täte.
      federwerk: >-
        Nennt Form A getrennt von Form B und schreibt die Werte der DIN 5008
        zu: Kopfzeile 27 mm, Faltmarke 1 bei 87 mm, Lochmarke bei 148,5 mm,
        Faltmarke 2 bei 192 mm — alle vier Maße dieser Regel, gemessen von der
        oberen Blattkante.
      dinbrief: >-
        `\addresshigh` setzt die Längen „entsprechend der Form A der DIN Norm":
        obere Faltmarke 87 mm, untere 192 mm, Bezugszeichenzeile 80,5 mm,
        untere Fensterecke 72 mm. Beruft sich dabei auf DIN 676 (Ausgabe
        Dezember 1976 und Entwurf Mai 1991), nicht auf DIN 5008 — siehe
        quellen.yaml.
    wirkung: fehler
    bemerkung: >-
      Nicht zu verwechseln mit den 32 mm, die der Wikipedia-Artikel für das
      Form-A-Anschriftfeld nennt: Das ist die Oberkante der Zusatz- und
      Vermerkzone, also die **Unterkante der Rücksendeangabe** (27 + 5), nicht
      die Unterkante des Briefkopfs. Derselbe 5-mm-Versatz tritt bei Form B auf
      (45 gegen 50) und hat dort dieselbe Ursache — siehe #345 und die
      Bemerkung an `geometrie.form_b.briefkopf`. Der Artikel stützt das selbst:
      Zeile 3 der Vermerkzone stehe „ca. 3,4 cm“ unter dem Blattrand, also
      weder 27 noch 32. Kein Beleg für diese Regel: Unsere 27 mm folgen aus dem
      Artikel nur über eine Subtraktion, und eine Subtraktion ist keine
      Nennung (ADR 0044). Die Stufe unten steht auf `massskizze_a` und
      `federwerk`, nicht auf dieser Rechnung.

      **Herkunft der Stufe.** `koma_script` und `dinbrief` berufen sich auf
      DIN 676, nicht auf DIN 5008 (Issue #134) — zwei Umsetzungen derselben
      Grundlage sind keine zwei Aussagen über DIN 5008, und sie zählen deshalb
      nur `einzeln`. Getragen wird die Stufe von `massskizze_a` (Zeichnung,
      Bezugsnorm 2020) und `federwerk` (Fließtext, der die Maße der DIN 5008
      zuschreibt, Issue #18): zwei voll zählende Quellen aus zwei Gruppen.

      **Seit dem 24.09.2026 `mehrfach_bestaetigt` (Issue #180, ADR 0046).**
      Zuvor stand hier `einzeln_belegt` mit dem Vermerk, die Anhebung mache
      aus der Warnung einen Fehler und ändere damit, was das Werkzeug tut. Das
      war nachgemessen falsch: Die Geometrie-Regeln tragen weder `lint:` noch
      `pruefung:`, und `geometrie.py` kennt diesen Katalog nicht — die Maße am
      fertigen PDF wirken seit jeher als Fehler. Die Stufe hier ist für die
      Geometrie eine Aussage über die Beleglage, keine über die Wirkung.

      Der Vergleich mit Form B trägt umgekehrt, als #180 annahm: Die fünf
      `geometrie.form_b.*` stehen auf `massskizze_b` und `onlineprinters` —
      zwei Ansichten **derselben** Zeichnung, eine Gruppe (Befund vom
      27.08.2026). Sie stehen deshalb in `regeln.stufe_traegt_nicht()`, dem
      offenen Rest von #16. Form A ist die einzige der sechs Formregeln, die
      die Definition erfüllt.

  # ── Geometrie, formunabhängig ────────────────────────────────────────────
  - id: geometrie.seitenformat
    titel: A4, 210 × 297 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, wikipedia, letter_pro]
    belegt_durch:
      wikipedia: >-
        Abschnitt „Briefvordrucke und Briefvorlagen (Abschnitt 16)“ nennt das
        Format wörtlich: „auf das Papierformat A4 (210 mm × 297 mm)
        abgestimmt“.
      massskizze_b: >-
        Bemaßt das Blatt nicht, legt es aber in beiden Richtungen fest:
        125 + 75 + 10 = 210 quer, 105 + 105 + 87 = 297 hoch. Alle sechs
        Summanden stehen als Maß in der Zeichnung.
    wirkung: fehler

  - id: geometrie.lochmarke
    titel: Lochmarke bei 148,5 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        148,5 mm von der oberen Blattkante, bemaßt und ausdrücklich als
        „Lochmarke“ beschriftet.
    wirkung: fehler

  - id: geometrie.seitenraender
    titel: Rand links 25 mm, rechts 20 mm, Textbreite 165 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, wikipedia, letter_pro]
    belegt_durch:
      wikipedia: >-
        Abschnitt „Briefgestaltung (Abschnitt 17)“ trägt den linken Rand: „Zeilen
        beginnen an der Fluchtlinie, 2,5 cm vom linken Blattrand entfernt.“
        Zum rechten Rand (20 mm) und zur Textbreite (165 mm) sagt der Artikel
        nichts — diese beiden Werte stehen hier ohne Beleg.
      massskizze_b: >-
        Rand links 25 mm und rechts 20 mm bemaßt. Die Textbreite 165 mm steht
        nicht in der Zeichnung; sie folgt aus 210 − 25 − 20.
    wirkung: fehler

  - id: geometrie.grundzeilenhoehe
    titel: Grundzeilenhöhe 4,23 mm (12 pt)
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        4,23 mm, zweimal bemaßt als Abstand ober- und unterhalb der Zeile
        „Seite x von y“. Die Zeichnung nennt den Wert, nicht den Begriff
        „Grundzeilenhöhe“.
    wirkung: fehler

  - id: geometrie.betreffabstand
    titel: Betreff zwei Leerzeilen (8,46 mm) unter dem tieferen von Feld und Block
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      massskizze_b: >-
        8,46 mm, zweimal bemaßt — vom Anschriftfeld und vom Informationsblock
        je zur Oberkante des Textfelds. Genau die Konstruktion „unter dem
        tieferen von Feld und Block“.
    wirkung: fehler

  - id: geometrie.infoblock_mindesthoehe
    titel: Informationsblock mindestens 40 mm hoch
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    wirkung: warnung
    bemerkung: In der Maßzeichnung ist die Höhe nicht bemaßt.

  - id: geometrie.markenlaenge
    titel: Marken 2,5 bis 5 mm lang, im Heftrand bis 20 mm von links
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    wirkung: warnung
    bemerkung: >-
      letter-pro zeichnet die Marken, legt aber keine Länge als Sollwert fest.
      Die Zeichnung bemaßt sie nicht.

  - id: geometrie.schriftgroessen
    titel: Fließtext mindestens 10 pt, Anschrift und Informationsblock mindestens 8 pt
    herkunft: einzeln_belegt
    quellen: [wikipedia]
    belegt_durch:
      wikipedia: >-
        Trägt die 8 Punkt: „die Postanschrift des Absenders (sogenannte
        Rücksendeangabe) in kleiner Schrift (8 Punkt)“ — allerdings nur für
        die Rücksendeangabe, nicht für Anschriftfeld und Informationsblock
        insgesamt. Zur Mindestgröße des Fließtexts (10 pt) schweigt der
        Artikel; „Schriftgröße“ steht dort nur als Mittel der Hervorhebung.
    wirkung: warnung
    bemerkung: Wikipedia nennt 8 pt für die Rücksendeangabe (seit 2011 zulässig).

  # ── Aufbau des Textteils ─────────────────────────────────────────────────
  - id: text.anrede_komma
    titel: Anrede endet mit Komma, der Text darunter beginnt klein
    lint: anrede
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters, letter_pro]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Komma“ kommt auf der Seite nicht vor.
    # wikipedia am 26.08.2026 entfernt: Der Artikel nennt das Wort „Komma" kein
    # einziges Mal — 13.020 Zeichen, ueber die API geholt und vollstaendig
    # durchsucht — und sagt zur Anrede ausdruecklich, ihr Textinhalt sei „hier
    # nicht geregelt". Die Quelle stand hier, ohne zur Regel etwas beizutragen,
    # und hob sie damit auf eine Stufe, die Laeufe scheitern lassen darf.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle: `onlineprinters` schweigt, `letter_pro`
      setzt das Layout, das geprüft würde, und bestätigt nichts. Eine
      Setzgewohnheit des Werkzeugs, Warnung bis zum Normabgleich (#12).

  - id: text.gruss_ohne_komma
    titel: Grußformel ohne Komma
    lint: gruss
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Grußformel“ steht nur im Titel eines verwandten Artikels,
        nicht im Text.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle. Eine Setzgewohnheit des Werkzeugs, Warnung
      bis zum Normabgleich (#12).

  - id: text.anlagen_ohne_doppelpunkt
    titel: „Anlage“/„Anlagen“ ohne Doppelpunkt
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Anlage“ steht einmal, und zwar in „an die Anlagennummer
        angehängt“ (Telefonanlage). Ein Treffer, der zu einer anderen Sache
        gehört.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle. Eine Setzgewohnheit des Werkzeugs, Warnung
      bis zum Normabgleich (#12).

  - id: text.folgeseiten
    titel: Folgeseiten tragen die Seitenzahl, Kopfzeile mit Betreffkurzform empfohlen
    herkunft: einzeln_belegt
    quellen: [massskizze_b]
    belegt_durch:
      massskizze_b: >-
        Zeigt unterhalb des Textfelds die Zeile „Seite x von y (Bei mehrseitigen
        Texten)“ — die Seitenzahl also ausdrücklich, und zwar am Fuß. Zur
        empfohlenen Kopfzeile mit Betreffkurzform sagt sie nichts.
    wirkung: warnung
    bemerkung: Die Zeichnung zeigt „Seite x von y (Bei mehrseitigen Texten)“.

  - id: text.anschrift_ohne_leerzeilen
    titel: Anschriftzone bis 6 Zeilen, keine Leerzeilen
    lint: empfaenger
    herkunft: einzeln_belegt
    quellen: [wikipedia, onlineprinters]
    belegt_durch:
      wikipedia: >-
        Trägt beide Hälften der Regel in eigener Prosa, in einem Satz:
        „Das EDV-gerechte Anschriftenfeld ist 9-zeilig nach internationaler
        Normung aufgebaut: 3 Zeilen für die Zusatz- und Vermerkzone (ZVZ),
        6 Zeilen für die Anschriftzone (AZ). […] Leerzeilen innerhalb der
        Anschrift sind nicht vorgesehen.“ Kein Normzitat, sondern ein
        Listenpunkt des Artikels — dieselbe Passage, aus der
        `text.vermerke_max_3` die 3 Zeilen der ZVZ nimmt.
      onlineprinters: >-
        SCHWEIGT — „Leerzeile“ kommt auf der Seite nicht vor.
    wirkung: warnung
    bemerkung: >-
      Bis zum 22.09.2026 als `herkunft: werkzeug` geführt, weil `onlineprinters`
      seit #31 schweigt und der Wikipedia-Artikel hier nie als Quelle eingetragen
      war. Mit #344 nachgetragen: Die Regel ist keine Setzgewohnheit des
      Werkzeugs, sie steht wörtlich in einer geführten Quelle (ADR 0044).
      `onlineprinters` schweigt unverändert; die Stufe trägt Wikipedia allein,
      deshalb Warnung und nicht Fehler.

  - id: text.vermerke_max_3
    titel: Zusatz- und Vermerkzone fasst bis zu 3 Zeilen
    lint: vermerke
    herkunft: einzeln_belegt
    quellen: [massskizze_b, onlineprinters, wikipedia, letter_pro]
    belegt_durch:
      wikipedia: >-
        Nennt die Zahl ohne Umweg über die Höhe: „Das EDV-gerechte
        Anschriftenfeld ist 9-zeilig nach internationaler Normung aufgebaut:
        3 Zeilen für die Zusatz- und Vermerkzone (ZVZ), 6 Zeilen für die
        Anschriftzone (AZ).“
      massskizze_b: >-
        SCHWEIGT — bemaßt die Zone mit 17,7 mm, nennt aber keine Zeilenzahl. Die
        Regel ist abgeleitet (12,7 mm : 4,23 mm), und die 12,7 mm stehen in
        dieser Zeichnung nicht einmal für sich.
      onlineprinters: >-
        SCHWEIGT — die Zonen werden erwähnt, eine Zeilenzahl nicht. Die Regel ist
        ohnehin abgeleitet (12,7 mm Zonenhöhe : 4,23 mm Zeilenhöhe), nicht
        zitiert.
    wirkung: warnung
    bemerkung: >-
      Bis #31 ein Fehler (mehrfach bestätigt), seither eine Warnung: Erst schwieg
      `onlineprinters`, am 22.09.2026 kam `massskizze_b` dazu — die Zeichnung
      bemaßt die Zone, zählt aber keine Zeilen. Am selben Tag trat der
      Wikipedia-Artikel an ihre Stelle, und der nennt die 3 Zeilen unmittelbar.
      Die Ableitung über die Zonenhöhe (12,7 mm : 4,23 mm) ist damit nicht mehr
      die einzige Begründung, sondern nur noch die Gegenrechnung dazu.

  # ── Schreibweisen ────────────────────────────────────────────────────────
  - id: schreibweise.datum
    titel: "Datum als „25. August 2026“ oder „2026-08-25“"
    lint: datum
    typografie: _datum
    herkunft: einzeln_belegt
    quellen: [wikipedia, onlineprinters, letter_pro]
    belegt_durch:
      wikipedia: >-
        Abschnitt „Briefgestaltung (Abschnitt 17)“ nennt beide Formen: „Das Datum
        wird numerisch 2006-06-07 (JJJJ-MM-TT) oder alphanumerisch
        7. Juni 2006 geschrieben“.
      onlineprinters: >-
        SCHWEIGT — der Artikel nennt „korrekte Schreibweisen von Datum“ nur als
        Thema der Norm und gibt kein Format an. Die Regel trägt Wikipedia, die
        beide Formen ausdrücklich nennt.
    wirkung: warnung
    bemerkung: >-
      Wikipedia nennt beide Formen ausdrücklich. Der Linter prüft nur, dass ein
      Datumsfeld eine dieser Formen hat, nicht welche. Bis #31 ein Fehler und
      eine selbsttätige Ersetzung (mehrfach bestätigt); die zweite volle Quelle
      schweigt, es bleibt Wikipedia allein — seither eine Warnung, der
      Typografie-Pass setzt nicht mehr und meldet stattdessen.

  - id: schreibweise.abkuerzungen
    titel: "Abkürzungen mit geschütztem Leerzeichen: z. B., u. a."
    typografie: _abkuerzungen
    herkunft: einzeln_belegt
    quellen: [wikipedia, onlineprinters, letter_pro]
    belegt_durch:
      wikipedia: >-
        Abschnitt „Abkürzungen (Abschnitt 4.5)“ trägt beides, Leerzeichen und
        Schutz: „ist zwischen den abgekürzten Wörtern jeweils ein Leerzeichen
        zu setzen: a. a. O., d. h., v. l. n. r., z. B. usw.“ und „sollte ein
        geschütztes Leerzeichen verwendet werden“.
      onlineprinters: >-
        SCHWEIGT — der Artikel nennt „die richtige Abkürzung von Titeln“ als
        Thema, aber keine Schreibregel. Die Regel trägt Wikipedia („a. a. O., d.
        h., v. l. n. r., z. B.“).
    wirkung: warnung
    bemerkung: >-
      Wikipedia nennt „a. a. O., d. h., v. l. n. r., z. B.“ wörtlich. Bis #31
      ein Fehler und eine selbsttätige Ersetzung (mehrfach bestätigt); die
      zweite volle Quelle schweigt, es bleibt Wikipedia allein — seither eine
      Warnung, der Typografie-Pass setzt nicht mehr und meldet stattdessen.

  - id: schreibweise.telefon
    titel: "Telefon „0941 620-9800“, international „+49 941 620-9800“"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Deutsche Norm mit internationaler Bedeutung“ (+49 89 8521476,
        Durchwahl mit Bindestrich) und Absatz „Im Geschäftsbrief kommt es auf die
        Details an“ (09161 6209800, 09161 620980-XX, Sondernummern)
    wirkung: warnung

  - id: schreibweise.kuerzel_vor_angabe
    titel: "Geschütztes Leerzeichen hinter Kürzeln vor einer Angabe: Nr. 4711, Tel. 0941, Az. 12/26"
    typografie: _vor_angabe
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Nicht gesondert nachgelesen. Die Prüfung vom 27.08.2026 lief unter
        zahlengliederung und suchte „Dreiergruppen“ und „geschützt“; beides
        kommt auf der Seite nicht vor. Was die Seite zu Kürzeln wie Nr. oder
        Tel. sagt, ist offen.
    wirkung: warnung
    bemerkung: >-
      Setzgewohnheit des Werkzeugs, keine Aussage, die eine der Quellen
      trägt; die Stufe steht bis zum Normabgleich (#31) unverändert. Die Liste
      `VOR_ANGABE` in typografie.py enthält auch „Rechnung“, das kein Kürzel
      ist — ob es dort bleibt, ist offen (#332).

  - id: schreibweise.zahlengliederung
    titel: "Zahlen in Dreiergruppen mit geschütztem Leerzeichen: 1 234 567,89"
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Dreiergruppen“ kommt auf der Seite nicht vor, „geschützt“
        ebenso wenig.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle. Kein Schritt und keine Prüfung setzt diese Regel um: Der Typografie-Pass
      gliedert keine Zahlen. Bis #332 hing `_vor_angabe` (geschütztes
      Leerzeichen hinter Nr., Tel., Az.) fälschlich an ihr; er trägt jetzt
      schreibweise.kuerzel_vor_angabe. Die Regel bleibt als Vorgabe stehen, bis
      der Normabgleich über sie entscheidet.

  - id: schreibweise.iban
    titel: "IBAN in Vierergruppen"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Internationale Bankleitzahl (IBAN)“: Vierergruppen von links, Rest
        als Zweiergruppe, Beispiel DE62 7625 1020 0221 0217 44
    wirkung: warnung

  - id: schreibweise.postfach
    titel: "Postfachnummer von rechts in Zweiergruppen"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Im Geschäftsbrief kommt es auf die Details an“: „Die
        Postfachnummer wird von rechts beginnend zweistellig gegliedert“, Beispiel
        89 09 32
    wirkung: warnung

  - id: schreibweise.uhrzeit
    titel: "Uhrzeit „11:30 Uhr“"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz zur Uhrzeit: „Nicht 11.30 Uhr, sondern 11:30 Uhr ist richtig“,
        volle Stunden ohne Minutenangabe
    wirkung: warnung

  - id: schreibweise.geldbetrag
    titel: "Geldbetrag „1.234,56 EUR“, Währung nachgestellt"
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Währungen“ wird als Thema genannt, ein Format nicht. Das
        Kürzel „EUR“ steht nirgends auf der Seite.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle. Eine Setzgewohnheit des Werkzeugs, Warnung
      bis zum Normabgleich (#12).

  - id: schreibweise.auslandsanschrift
    titel: Ort und Land in Großbuchstaben, Land auf Deutsch in der letzten Zeile
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Im Geschäftsbrief kommt es auf die Details an“: Bestimmungsort und
        -land in Großbuchstaben, Ort in der Landessprache (FIRENZE), Land deutsch
        in der letzten Zeile, kein Länderkennzeichen
    wirkung: warnung

  - id: schreibweise.akademischer_grad
    titel: Grad vor dem Namen, Bachelor/Master dahinter
    herkunft: offen
    quellen: []
    wirkung: keine
    bemerkung: >-
      Steht in references/din5008.md ohne Beleg. Wird deshalb nicht geprüft,
      bis eine Quelle vorliegt.

  - id: schreibweise.einheiten
    titel: Einheiten und Zeichen nicht vom Zahlwert trennen (5 kg, 20 %, § 3)
    typografie: _einheiten
    herkunft: werkzeug
    deckel: warnung
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — im Artikel nicht erwähnt.
    wirkung: warnung
    bemerkung: >-
      Seit #31 ohne zählende Quelle. Eine Setzgewohnheit des Werkzeugs: Der
      Typografie-Pass setzt nicht, er meldet, bis der Normabgleich (#12) über
      die Regel entscheidet.

  # ── Prüfungen des Werkzeugs, keine Normaussage ───────────────────────────
  - id: werkzeug.betreff_laenge
    titel: Betreff höchstens 150 Zeichen (zwei Zeilen bei 165 mm Satzbreite)
    lint: betreff
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Eigene Herleitung aus Satzbreite und Schriftgröße. Die Norm nennt keine
      Zeichenzahl; sie begrenzt den Betreff auf zwei Zeilen.

  - id: werkzeug.betreff_leitwort
    titel: Betreff ohne das Leitwort „Betreff“
    lint: betreff.leitwort
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Datenvertrag des Werkzeugs, keine Normaussage (#296): In
      `references/din5008.md` steht nichts zum Leitwort, und ob eine der
      Briefquellen es hergibt, ist nicht geprüft. Der Betreff steht für sich;
      ein „Betreff:“ davor wäre doppelt. Bis eine Quelle vorliegt, bleibt es
      eine Zusage des Werkzeugs und heißt deshalb `werkzeug`, nicht `offen`.
      Getrennt von `werkzeug.betreff_laenge`, damit eine Herabstufung der Länge
      das Leitwort nicht mitzieht.

  - id: werkzeug.betreff_schlusspunkt
    titel: Betreff ohne Schlusspunkt
    lint: betreff.schlusspunkt
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Datenvertrag des Werkzeugs, keine Normaussage (#296): `references/din5008.md`
      sagt zum Schlusspunkt nichts. Gleiche Lage und gleiche Begründung wie bei
      `werkzeug.betreff_leitwort`; getrennt von der Länge aus demselben Grund.

  - id: werkzeug.url_im_text
    titel: URL im Brieftext
    lint: url
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: Auf Papier gibt es nichts zum Anklicken.

  - id: werkzeug.logo_hoehe_ohne_logo
    titel: Logohöhe im Briefkopf ohne Logo
    lint: briefkopf.logo_hoehe_mm
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Die Norm sagt nichts über Logos. `logo_hoehe_mm` wirkt nur zusammen mit
      `logo:`; steht es allein, bleibt es folgenlos und niemand erfährt es.
      Warnung, weil es Absicht sein kann.

  - id: werkzeug.email_im_infoblock
    titel: E-Mail-Adresse im Informationsblock muss eine sein
    lint: infoblock.email
    herkunft: werkzeug
    quellen: []
    wirkung: fehler

  - id: werkzeug.tabulator
    titel: Tabulator im Markdown
    lint: tabulator
    herkunft: werkzeug
    quellen: []
    wirkung: warnung

  - id: werkzeug.umbruch
    titel: Zeilenumbruch durch zwei Leerzeichen
    lint: umbruch
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: Unsichtbar in jeder Vorschau — deshalb die Warnung.


  - id: werkzeug.dialekt
    titel: Das Feld `dialekt` trägt eine bekannte Fassung
    lint: dialekt
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine Aussage der Norm, sondern eine über den Datenvertrag. Ein Tippfehler
      dürfte nicht stillschweigend zur alten Fassung führen — der Brief sähe
      dann anders aus als geschrieben, und die Meldung, die erklärt warum, käme
      nie.

  # ── Dialekt 1.1: lange Schreiben ─────────────────────────────────────────
  #
  # Alle drei tragen `werkzeug`, und das ist eine bewusste Angabe: Zu
  # Zwischenüberschriften im Geschäftsbrief liegt **keine** der hier geführten
  # Sekundärquellen etwas vor, was einen Sollwert trüge. Sie als
  # `einzeln_belegt` zu führen wäre eine Quellenbehauptung, die es nicht gibt.
  # Was nach dem Normabgleich (Abschnitte zu Hervorhebungen, Aufzählungen und
  # Überschriften) dazukommt, ersetzt diese Einträge — nicht umgekehrt.

  - id: werkzeug.ueberschrift_ebenen
    titel: Zwischenüberschriften gehen bis vier Ebenen
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Abschnitt, Unterabschnitt, Punkt, Unterpunkt — die fünfte Ebene gliedert
      nicht mehr, sie versteckt. Geprüft beim Lesen des Markdowns, nicht am PDF.
      Ab Ebene 5 bricht es ab statt herabzustufen: Eine still zur vierten
      gemachte fünfte Ebene wäre genau das stille Verändern, gegen das dieses
      Werkzeug antritt.

  - id: werkzeug.listentiefe
    titel: Aufzählungen gehen bis sechs Ebenen (Fassung 1.0 bis zwei)
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Gestuft statt als Wand: bis Ebene 4 still, Ebene 5 und 6 mit Warnung, ab 7
      Abbruch. Der Standardbrief (Fassung 1.0) bleibt bei zwei Ebenen — dort
      ändert sich nichts.

  - id: werkzeug.ueberschrift_abstaende
    titel: Abstände über einer Zwischenüberschrift
    herkunft: werkzeug
    quellen: []
    wirkung: keine
    bemerkung: >-
      Zwei Rasterzeilen über Ebene 1, eine über den übrigen; alle vier Ebenen in
      derselben Schriftgröße. Das folgt dem 12-pt-Raster des Werkzeugs, nicht
      einer Normaussage — eine größere Zeile wäre höher als eine Rasterzeile,
      und alles darunter verlöre seine Position. `wirkung: keine`, weil dieser
      Eintrag keine eigene Prüfung hat: Ein Abstand außerhalb des Rasters fällt
      seit Issue #140 unter `werkzeug.zeilenraster` auf, nicht hier.

  - id: werkzeug.zitattiefe
    titel: Zitate stehen bis zwei Ebenen ineinander
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Zwei Ebenen decken den Fall ab, für den es sie gibt: ein Zitat, das
      seinerseits zitiert. Ab der dritten ist nicht mehr erkennbar, wer wen
      wiedergibt — und genau das ist beim Zitieren der Punkt.

  - id: werkzeug.wortlaut_unveraendert
    titel: Ein wortgetreuer Auszug wird weder umbrochen noch typografisch geändert
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Der Typografie-Pass läuft im Auszug nicht: Ein Zitat, in dem aus einem
      geraden Anführungszeichen ein typografisches und aus zwei Bindestrichen
      ein Halbgeviertstrich wird, gibt nicht mehr wieder, was dastand. Aus
      demselben Grund fügt das Werkzeug keinen Umbruch ein. Was es nicht kann,
      ist den Satz daran hindern: Typst bricht eine zu lange Zeile an einem
      Leerzeichen um, und acht Wege, ihm das abzugewöhnen, sind an Issue #173
      gemessen und gescheitert. Deshalb wird eine zu lange Zeile gemeldet,
      bevor sie gesetzt wird — siehe `werkzeug.auszug_zeilenlaenge`.

  - id: werkzeug.auszug_zeilenlaenge
    titel: Eine Zeile im wortgetreuen Auszug passt in den Satzspiegel
    lint: auszug
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Eine Zeile über 68 Zeichen (im Fließtext über 70) hat zwei Ausgänge, und
      bis Issue #173 fiel nur einer auf: Ohne Umbruchstelle läuft sie nach
      rechts aus dem Satzspiegel, und `verify` meldet das. Mit einem
      Leerzeichen bricht der Satz sie um — gemessen an einer 81 Zeichen langen
      Protokollzeile, die im PDF auf zwei Zeilen steht, während der Lauf
      „42/42 Maße eingehalten" meldet. Ein umbrochener Protokolleintrag ist
      ein anderer Eintrag. Die Prüfung läuft deshalb an der Quelle, wo die
      Zeilennummer noch bekannt ist. Warnung und nicht Fehler: Der Brief soll
      trotzdem entstehen, damit sich das Ergebnis ansehen lässt.

  - id: werkzeug.zeilenraster
    titel: Der Briefkörper steht auf dem 12-pt-Raster
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine eigene Aussage der Norm, sondern die Folge einer: Die Grundzeile
      misst 12 pt, und jede „Leerzeile" ist genau eine davon. Daraus ergibt sich
      die Betreffposition, die als `geometrie.betreffabstand` mehrfach belegt
      ist. Ob die Zeilen dazwischen das Raster halten, war bis Issue #140 eine
      Zusage des Satz-Quelltextes und sonst nichts — ein krummer Abstand
      veränderte das PDF messbar, und alle Prüfungen blieben grün. Gemessen
      werden die Abstände aufeinanderfolgender Zeilen des Briefkörpers, nicht
      ihre absolute Lage: Ein Versatz soll einmal auffallen, nicht in jeder
      Zeile darunter noch einmal. Tabellen sind ausgenommen (Issue #151).


  - id: werkzeug.eingebettet
    titel: Eine eingebettete Datei trägt Medientyp, Beschreibung und Beziehung
    lint: eingebettet
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine Aussage der Norm — die DIN 5008 beschreibt ein Blatt Papier und
      kennt keine Dateien im Dokument. Die Pflichtangaben kommen aus PDF/A-3b:
      Ohne Medientyp und Beschreibung bricht schon der Satz ab (typst-py 0.15,
      gemessen 29.08.2026), und die Beziehungsangabe kennt genau vier Werte.
      Der Datenvertrag wiederholt beides, damit der Fehler mit Feld und Zeile
      gemeldet wird statt als Compilerfehler.

      Wer etwas einbettet, bekommt PDF/A-3b statt 2b — verlangt, nicht
      stillschweigend umgestellt (ADR 0033). PDF/A-2 kennt keine beliebigen
      Dateien im Dokument; ohne die Stufe gibt es keine Einbettung und ohne
      Einbettung kein ZUGFeRD (Issue #114, Grundlage für #111).
