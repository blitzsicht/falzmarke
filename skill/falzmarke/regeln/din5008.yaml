# Quellenlage je Regel — die einzige Stelle, an der die Herkunft gepflegt wird.
#
# Warum es diese Datei gibt: Alle Maße und Schreibregeln in falzmarke stammen aus
# Sekundärquellen. Der Abgleich mit dem Originaltext der DIN 5008:2020-03 steht
# aus (Issue: Normabgleich). Bis dahin darf das Werkzeug nur als Fehler melden,
# was mehrfach belegt ist — und muss sagen, woher es das weiß.
#
# herkunft (genau einer):
#   mehrfach_bestaetigt  mindestens ZWEI Quellen mit `zaehlt: voll`
#   einzeln_belegt       mindestens eine Quelle mit `zaehlt: voll` oder `einzeln`
#   offen                Annahme ohne Beleg
#   werkzeug             keine Aussage der Norm, sondern eine Prüfung des
#                        Werkzeugs (siehe unten)
#
# Zu `werkzeug`: Der Auftrag sah drei Werte vor. Es gibt aber Regeln, die gar
# keine Normaussage treffen — ein Tabulator im Markdown, eine URL im Fließtext,
# ein Betreff, der über zwei Zeilen läuft. Sie als `offen` zu führen hieße, sie
# dürften nicht prüfen; sie als `einzeln_belegt` zu führen wäre eine
# Quellenbehauptung, die es nicht gibt. Deshalb der vierte Wert. Er wirkt wie
# `mehrfach_bestaetigt` (darf Fehler sein), sagt aber nichts über die Norm.
#
# wirkung: fehler | warnung | keine — was der Linter höchstens tun darf.
#   Der Linter stuft selbst herab: einzeln_belegt wird immer zur Warnung.
#
# Die Quellen stehen in `quellen.yaml`, die E-Mail-Regeln in `email.yaml`.
# Diese Datei traegt die Regeln, die sich auf die DIN 5008 berufen, und die
# Pruefungen des Werkzeugs, die gar keine Normaussage treffen.
#

regeln:

  # ── Geometrie, Form B ────────────────────────────────────────────────────
  - id: geometrie.form_b.briefkopf
    titel: Briefkopfhöhe Form B, 45 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.form_b.anschriftfeld
    titel: Anschriftfeld 85 × 45 mm, linke Kante 20 mm, Text ab 25 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.form_b.zonen
    titel: Rücksendeangabe 5 mm, Zusatz-/Vermerkzone 12,7 mm, Anschriftzone 27,3 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler
    bemerkung: >-
      Die Maßzeichnung fasst die ersten beiden zu 17,7 mm zusammen
      („Zusatz- und Vermerkzone mit integrierter Rücksendeangabe“).
      5 + 12,7 = 17,7 — dieselben Werte, feiner aufgelöst.

  - id: geometrie.form_b.infoblock
    titel: Informationsblock x = 125 mm, Breite 75 mm, Oberkante 50 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.form_b.falzmarken
    titel: Falzmarken bei 105 und 210 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  # ── Geometrie, Form A ────────────────────────────────────────────────────
  - id: geometrie.form_a.masse
    titel: Form A — Briefkopf 27 mm, Anschriftfeld ab 27 mm, Falzmarken 87 / 192 mm
    herkunft: einzeln_belegt
    quellen: [massskizze_a, koma_script, letter_pro, dinbrief]
    belegt_durch:
      dinbrief: >-
        `\addresshigh` setzt die Längen „entsprechend der Form A der DIN Norm":
        obere Faltmarke 87 mm, untere 192 mm, Bezugszeichenzeile 80,5 mm,
        untere Fensterecke 72 mm. Beruft sich dabei auf DIN 676 (Ausgabe
        Dezember 1976 und Entwurf Mai 1991), nicht auf DIN 5008 — siehe
        quellen.yaml.
    wirkung: warnung
    bemerkung: >-
      Schwächer belegt als Form B, und das ist erst durch diese Erhebung
      aufgefallen. Eine bemaßte Zeichnung für Form A gibt es auf Wikimedia
      Commons nicht; Wikipedia nennt im Text nur die 32 mm für den Beginn der
      Anschrift (= 27 mm Feldoberkante plus 5 mm Rücksendezone). Bleibt bis
      zum Normabgleich eine Warnung.

      Seit dem 29.08.2026 steht `dinbrief` daneben (Issue #134) — die erste
      Quelle für Form A, die falzmarke nicht selbst benutzt und die ihre Werte
      ausdrücklich als Form A bezeichnet. Sie hebt die Stufe **nicht**: Wie
      `koma_script` beruft sie sich auf DIN 676, nicht auf DIN 5008. Zwei
      Umsetzungen derselben Grundlage sind keine zwei Aussagen über DIN 5008.
      Was #18 fehlt, ist damit kleiner geworden, aber nicht erledigt.

  # ── Geometrie, formunabhängig ────────────────────────────────────────────
  - id: geometrie.seitenformat
    titel: A4, 210 × 297 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, wikipedia, letter_pro]
    wirkung: fehler

  - id: geometrie.lochmarke
    titel: Lochmarke bei 148,5 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.seitenraender
    titel: Rand links 25 mm, rechts 20 mm, Textbreite 165 mm
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, wikipedia, letter_pro]
    wirkung: fehler

  - id: geometrie.grundzeilenhoehe
    titel: Grundzeilenhöhe 4,23 mm (12 pt)
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.betreffabstand
    titel: Betreff zwei Leerzeilen (8,46 mm) unter dem tieferen von Feld und Block
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    wirkung: fehler

  - id: geometrie.infoblock_mindesthoehe
    titel: Informationsblock mindestens 40 mm hoch
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    wirkung: warnung
    bemerkung: In der Maßzeichnung ist die Höhe nicht bemaßt.

  - id: geometrie.markenlaenge
    titel: Marken 2,5 bis 5 mm lang, im Heftrand bis 20 mm von links
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    wirkung: warnung
    bemerkung: >-
      letter-pro zeichnet die Marken, legt aber keine Länge als Sollwert fest.
      Die Zeichnung bemaßt sie nicht.

  - id: geometrie.schriftgroessen
    titel: Fließtext mindestens 10 pt, Anschrift und Informationsblock mindestens 8 pt
    herkunft: einzeln_belegt
    quellen: [wikipedia]
    wirkung: warnung
    bemerkung: Wikipedia nennt 8 pt für die Rücksendeangabe (seit 2011 zulässig).

  # ── Aufbau des Textteils ─────────────────────────────────────────────────
  - id: text.anrede_komma
    titel: Anrede endet mit Komma, der Text darunter beginnt klein
    lint: anrede
    herkunft: einzeln_belegt
    quellen: [onlineprinters, letter_pro]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Komma“ kommt auf der Seite nicht vor.
    # wikipedia am 26.08.2026 entfernt: Der Artikel nennt das Wort „Komma" kein
    # einziges Mal — 13.020 Zeichen, ueber die API geholt und vollstaendig
    # durchsucht — und sagt zur Anrede ausdruecklich, ihr Textinhalt sei „hier
    # nicht geregelt". Die Quelle stand hier, ohne zur Regel etwas beizutragen,
    # und hob sie damit auf eine Stufe, die Laeufe scheitern lassen darf.
    wirkung: warnung

  - id: text.gruss_ohne_komma
    titel: Grußformel ohne Komma
    lint: gruss
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Grußformel“ steht nur im Titel eines verwandten Artikels,
        nicht im Text.
    wirkung: warnung

  - id: text.anlagen_ohne_doppelpunkt
    titel: „Anlage“/„Anlagen“ ohne Doppelpunkt
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Anlage“ steht einmal, und zwar in „an die Anlagennummer
        angehängt“ (Telefonanlage). Ein Treffer, der zu einer anderen Sache
        gehört.
    wirkung: warnung

  - id: text.folgeseiten
    titel: Folgeseiten tragen die Seitenzahl, Kopfzeile mit Betreffkurzform empfohlen
    herkunft: einzeln_belegt
    quellen: [massskizze_b]
    wirkung: warnung
    bemerkung: Die Zeichnung zeigt „Seite x von y (Bei mehrseitigen Texten)“.

  - id: text.anschrift_ohne_leerzeilen
    titel: Anschriftzone bis 6 Zeilen, keine Leerzeilen
    lint: empfaenger
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Leerzeile“ kommt auf der Seite nicht vor.
    wirkung: warnung

  - id: text.vermerke_max_3
    titel: Zusatz- und Vermerkzone fasst bis zu 3 Zeilen
    lint: vermerke
    herkunft: mehrfach_bestaetigt
    quellen: [massskizze_b, onlineprinters, letter_pro]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — die Zonen werden erwähnt, eine Zeilenzahl nicht. Die Regel ist
        ohnehin abgeleitet (12,7 mm Zonenhöhe : 4,23 mm Zeilenhöhe), nicht
        zitiert.
    wirkung: fehler
    bemerkung: Folgt aus der Zonenhöhe von 12,7 mm bei 4,23 mm Zeilenhöhe.

  # ── Schreibweisen ────────────────────────────────────────────────────────
  - id: schreibweise.datum
    titel: "Datum als „25. August 2026“ oder „2026-08-25“"
    lint: datum
    typografie: _datum
    herkunft: mehrfach_bestaetigt
    quellen: [wikipedia, onlineprinters, letter_pro]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — der Artikel nennt „korrekte Schreibweisen von Datum“ nur als
        Thema der Norm und gibt kein Format an. Die Regel trägt Wikipedia, die
        beide Formen ausdrücklich nennt.
    wirkung: fehler
    bemerkung: >-
      Wikipedia nennt beide Formen ausdrücklich. Der Linter prüft nur, dass ein
      Datumsfeld eine dieser Formen hat, nicht welche.

  - id: schreibweise.abkuerzungen
    titel: "Abkürzungen mit geschütztem Leerzeichen: z. B., u. a."
    typografie: _abkuerzungen
    herkunft: mehrfach_bestaetigt
    quellen: [wikipedia, onlineprinters, letter_pro]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — der Artikel nennt „die richtige Abkürzung von Titeln“ als
        Thema, aber keine Schreibregel. Die Regel trägt Wikipedia („a. a. O., d.
        h., v. l. n. r., z. B.“).
    wirkung: fehler
    bemerkung: Wikipedia nennt „a. a. O., d. h., v. l. n. r., z. B.“ wörtlich.

  - id: schreibweise.telefon
    titel: "Telefon „0941 620-9800“, international „+49 941 620-9800“"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Deutsche Norm mit internationaler Bedeutung“ (+49 89 8521476,
        Durchwahl mit Bindestrich) und Absatz „Im Geschäftsbrief kommt es auf die
        Details an“ (09161 6209800, 09161 620980-XX, Sondernummern)
    wirkung: warnung

  - id: schreibweise.zahlengliederung
    titel: "Zahlen in Dreiergruppen mit geschütztem Leerzeichen: 1 234 567,89"
    typografie: _vor_angabe
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Dreiergruppen“ kommt auf der Seite nicht vor, „geschützt“
        ebenso wenig.
    wirkung: warnung

  - id: schreibweise.iban
    titel: "IBAN in Vierergruppen"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Internationale Bankleitzahl (IBAN)“: Vierergruppen von links, Rest
        als Zweiergruppe, Beispiel DE62 7625 1020 0221 0217 44
    wirkung: warnung

  - id: schreibweise.postfach
    titel: "Postfachnummer von rechts in Zweiergruppen"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Im Geschäftsbrief kommt es auf die Details an“: „Die
        Postfachnummer wird von rechts beginnend zweistellig gegliedert“, Beispiel
        89 09 32
    wirkung: warnung

  - id: schreibweise.uhrzeit
    titel: "Uhrzeit „11:30 Uhr“"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz zur Uhrzeit: „Nicht 11.30 Uhr, sondern 11:30 Uhr ist richtig“,
        volle Stunden ohne Minutenangabe
    wirkung: warnung

  - id: schreibweise.geldbetrag
    titel: "Geldbetrag „1.234,56 EUR“, Währung nachgestellt"
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — „Währungen“ wird als Thema genannt, ein Format nicht. Das
        Kürzel „EUR“ steht nirgends auf der Seite.
    wirkung: warnung

  - id: schreibweise.auslandsanschrift
    titel: Ort und Land in Großbuchstaben, Land auf Deutsch in der letzten Zeile
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        Absatz „Im Geschäftsbrief kommt es auf die Details an“: Bestimmungsort und
        -land in Großbuchstaben, Ort in der Landessprache (FIRENZE), Land deutsch
        in der letzten Zeile, kein Länderkennzeichen
    wirkung: warnung

  - id: schreibweise.akademischer_grad
    titel: Grad vor dem Namen, Bachelor/Master dahinter
    herkunft: offen
    quellen: []
    wirkung: keine
    bemerkung: >-
      Steht in references/din5008.md ohne Beleg. Wird deshalb nicht geprüft,
      bis eine Quelle vorliegt.

  - id: schreibweise.einheiten
    titel: Einheiten und Zeichen nicht vom Zahlwert trennen (5 kg, 20 %, § 3)
    typografie: _einheiten
    herkunft: einzeln_belegt
    quellen: [onlineprinters]
    belegt_durch:
      onlineprinters: >-
        SCHWEIGT — im Artikel nicht erwähnt.
    wirkung: warnung

  # ── Prüfungen des Werkzeugs, keine Normaussage ───────────────────────────
  - id: werkzeug.betreff_laenge
    titel: Betreff höchstens 150 Zeichen (zwei Zeilen bei 165 mm Satzbreite)
    lint: betreff
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Eigene Herleitung aus Satzbreite und Schriftgröße. Die Norm nennt keine
      Zeichenzahl; sie begrenzt den Betreff auf zwei Zeilen.

  - id: werkzeug.url_im_text
    titel: URL im Brieftext
    lint: url
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: Auf Papier gibt es nichts zum Anklicken.

  - id: werkzeug.email_im_infoblock
    titel: E-Mail-Adresse im Informationsblock muss eine sein
    lint: infoblock.email
    herkunft: werkzeug
    quellen: []
    wirkung: fehler

  - id: werkzeug.tabulator
    titel: Tabulator im Markdown
    lint: tabulator
    herkunft: werkzeug
    quellen: []
    wirkung: warnung

  - id: werkzeug.umbruch
    titel: Zeilenumbruch durch zwei Leerzeichen
    lint: umbruch
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: Unsichtbar in jeder Vorschau — deshalb die Warnung.


  - id: werkzeug.dialekt
    titel: Das Feld `dialekt` trägt eine bekannte Fassung
    lint: dialekt
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine Aussage der Norm, sondern eine über den Datenvertrag. Ein Tippfehler
      dürfte nicht stillschweigend zur alten Fassung führen — der Brief sähe
      dann anders aus als geschrieben, und die Meldung, die erklärt warum, käme
      nie.

  # ── Dialekt 1.1: lange Schreiben ─────────────────────────────────────────
  #
  # Alle drei tragen `werkzeug`, und das ist eine bewusste Angabe: Zu
  # Zwischenüberschriften im Geschäftsbrief liegt **keine** der hier geführten
  # Sekundärquellen etwas vor, was einen Sollwert trüge. Sie als
  # `einzeln_belegt` zu führen wäre eine Quellenbehauptung, die es nicht gibt.
  # Was nach dem Normabgleich (Abschnitte zu Hervorhebungen, Aufzählungen und
  # Überschriften) dazukommt, ersetzt diese Einträge — nicht umgekehrt.

  - id: werkzeug.ueberschrift_ebenen
    titel: Zwischenüberschriften gehen bis vier Ebenen
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Abschnitt, Unterabschnitt, Punkt, Unterpunkt — die fünfte Ebene gliedert
      nicht mehr, sie versteckt. Geprüft beim Lesen des Markdowns, nicht am PDF.
      Ab Ebene 5 bricht es ab statt herabzustufen: Eine still zur vierten
      gemachte fünfte Ebene wäre genau das stille Verändern, gegen das dieses
      Werkzeug antritt.

  - id: werkzeug.listentiefe
    titel: Aufzählungen gehen bis sechs Ebenen (Fassung 1.0 bis zwei)
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Gestuft statt als Wand: bis Ebene 4 still, Ebene 5 und 6 mit Warnung, ab 7
      Abbruch. Der Standardbrief (Fassung 1.0) bleibt bei zwei Ebenen — dort
      ändert sich nichts.

  - id: werkzeug.ueberschrift_abstaende
    titel: Abstände über einer Zwischenüberschrift
    herkunft: werkzeug
    quellen: []
    wirkung: keine
    bemerkung: >-
      Zwei Rasterzeilen über Ebene 1, eine über den übrigen; alle vier Ebenen in
      derselben Schriftgröße. Das folgt dem 12-pt-Raster des Werkzeugs, nicht
      einer Normaussage — eine größere Zeile wäre höher als eine Rasterzeile,
      und alles darunter verlöre seine Position. `wirkung: keine`, weil dieser
      Eintrag keine eigene Prüfung hat: Ein Abstand außerhalb des Rasters fällt
      seit Issue #140 unter `werkzeug.zeilenraster` auf, nicht hier.

  - id: werkzeug.zitattiefe
    titel: Zitate stehen bis zwei Ebenen ineinander
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Zwei Ebenen decken den Fall ab, für den es sie gibt: ein Zitat, das
      seinerseits zitiert. Ab der dritten ist nicht mehr erkennbar, wer wen
      wiedergibt — und genau das ist beim Zitieren der Punkt.

  - id: werkzeug.wortlaut_unveraendert
    titel: Ein wortgetreuer Auszug wird weder umbrochen noch typografisch geändert
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Der Typografie-Pass läuft im Auszug nicht: Ein Zitat, in dem aus einem
      geraden Anführungszeichen ein typografisches und aus zwei Bindestrichen
      ein Halbgeviertstrich wird, gibt nicht mehr wieder, was dastand. Aus
      demselben Grund wird nicht umbrochen — der Auszug läuft ab 69 Zeichen je
      Zeile aus dem Satzspiegel, und die Satzspiegelprüfung meldet das. Das ist
      gewollt: lieber ein sichtbarer Befund als ein still veränderter Wortlaut.

  - id: werkzeug.zeilenraster
    titel: Der Briefkörper steht auf dem 12-pt-Raster
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine eigene Aussage der Norm, sondern die Folge einer: Die Grundzeile
      misst 12 pt, und jede „Leerzeile" ist genau eine davon. Daraus ergibt sich
      die Betreffposition, die als `geometrie.betreffabstand` mehrfach belegt
      ist. Ob die Zeilen dazwischen das Raster halten, war bis Issue #140 eine
      Zusage des Satz-Quelltextes und sonst nichts — ein krummer Abstand
      veränderte das PDF messbar, und alle Prüfungen blieben grün. Gemessen
      werden die Abstände aufeinanderfolgender Zeilen des Briefkörpers, nicht
      ihre absolute Lage: Ein Versatz soll einmal auffallen, nicht in jeder
      Zeile darunter noch einmal. Tabellen sind ausgenommen (Issue #151).


  - id: werkzeug.eingebettet
    titel: Eine eingebettete Datei trägt Medientyp, Beschreibung und Beziehung
    lint: eingebettet
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Keine Aussage der Norm — die DIN 5008 beschreibt ein Blatt Papier und
      kennt keine Dateien im Dokument. Die Pflichtangaben kommen aus PDF/A-3b:
      Ohne Medientyp und Beschreibung bricht schon der Satz ab (typst-py 0.15,
      gemessen 29.08.2026), und die Beziehungsangabe kennt genau vier Werte.
      Der Datenvertrag wiederholt beides, damit der Fehler mit Feld und Zeile
      gemeldet wird statt als Compilerfehler.

      Wer etwas einbettet, bekommt PDF/A-3b statt 2b — verlangt, nicht
      stillschweigend umgestellt (ADR 0033). PDF/A-2 kennt keine beliebigen
      Dateien im Dokument; ohne die Stufe gibt es keine Einbettung und ohne
      Einbettung kein ZUGFeRD (Issue #114, Grundlage für #111).
