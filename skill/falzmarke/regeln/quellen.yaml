  geng_25a:
    titel: "§ 25a GenG — Angaben auf Geschäftsbriefen"
    url: https://www.gesetze-im-internet.de/geng/__25a.html
    art: primaerquelle
    gruppe: geng_25a
    zaehlt: voll
