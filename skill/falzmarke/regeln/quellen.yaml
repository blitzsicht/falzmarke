  uwg_7:
    titel: "§ 7 UWG — Unzumutbare Belästigungen"
    url: https://www.gesetze-im-internet.de/uwg_2004/__7.html
    art: primaerquelle
    gruppe: uwg_7
    zaehlt: voll
    abgerufen: 2026-08-28
    bemerkung: >-
      Der Grund, warum falzmarke keine Werbemails erzeugt (ADR 0035). Werbung
      per E-Mail setzt eine Einwilligung voraus, deren Nachweis der Versender
      fuehren muss — ein Werkzeug, das nichts versendet und niemanden kennt,
      kann ihn nicht fuehren.

  mopeg:
    titel: >-
      Artikel 51 MoPeG — Änderung des Handelsgesetzbuchs
      (Personengesellschaftsrechtsmodernisierungsgesetz, ausgefertigt am 10.08.2021)
    url: https://www.buzer.de/51_MoPeG.htm
    art: primaerquelle
    gruppe: mopeg
    zaehlt: voll
    abgerufen: 2026-08-29
    bemerkung: >-
      Das Aenderungsgesetz, das § 125a HGB zum 1. Januar 2024 aufgehoben und den
      Inhalt nach § 125 HGB ueberfuehrt hat. Deshalb steht in docs/recht.md
      keine Fundstelle zu § 125a: Die amtliche Sammlung fuehrt nur geltendes
      Recht, und ein Verweis ginge ins Leere.

      Nicht bei gesetze-im-internet.de, aus demselben Grund wie beim EHUG — dort
      stehen konsolidierte Fassungen, und ein Aenderungsgesetz hat keine eigene
      Seite. Bis zum 29.08.2026 zeigte der Link im Text auf `hgb/__125.html`,
      also auf das GEAENDERTE Gesetz: Wer nachschlagen wollte, was das MoPeG
      anordnet, fand dort nichts darueber.

      Nachgeschlagen am 29.08.2026: Artikel 51 Nummer 16 b) ersetzt die Angabe
      „§ 125a Abs. 1 Satz 2" durch „§ 125 Absatz 1 Satz 2"; Geltung ab
      01.01.2024, abweichend siehe Artikel 137.

  ehug:
    titel: >-
      EHUG — Gesetz über elektronische Handelsregister und Genossenschaftsregister
      sowie das Unternehmensregister, ausgefertigt am 10.11.2006
    url: https://www.buzer.de/gesetz/7443/index.htm
    art: primaerquelle
    gruppe: ehug
    zaehlt: voll
    abgerufen: 2026-08-28
    bemerkung: >-
      Seit dem Inkrafttreten am 1. Januar 2007 gelten die Vorschriften ueber
      Geschaeftsbriefe „gleichviel welcher Form"; eine geschaeftliche E-Mail ist
      damit erfasst. Nicht bei gesetze-im-internet.de: Dort stehen nur
      konsolidierte Fassungen, und ein Aenderungsgesetz hat dort keine Seite.
