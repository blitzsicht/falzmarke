    art: primaerquelle
    gruppe: hgb_37a
    zaehlt: voll
    abgerufen: 2026-08-28

  hgb_125:
    titel: "§ 125 HGB — Angaben auf Geschäftsbriefen (OHG und KG)"
    url: https://www.gesetze-im-internet.de/hgb/__125.html
    art: primaerquelle
    gruppe: hgb_125
    zaehlt: voll
    abgerufen: 2026-08-28
    bemerkung: >-
      Bis Ende 2023 stand das in § 125a HGB. Das MoPeG hat die Vorschrift zum
      1. Januar 2024 aufgehoben und den Inhalt nach § 125 HGB ueberfuehrt. Die
      alte Nummer stand hier noch, als es sie nicht mehr gab — deshalb das
      Abrufdatum an jedem Eintrag.

  gmbhg_35a:
    titel: "§ 35a GmbHG — Angaben auf Geschäftsbriefen"
    url: https://www.gesetze-im-internet.de/gmbhg/__35a.html
    art: primaerquelle
    gruppe: gmbhg_35a
    zaehlt: voll
    abgerufen: 2026-08-28

