# Die Regeln der E-Mail-Fassung, nach Ebenen getrennt (ADR 0035).
#
# Bis v0.8.1 standen sie in `din5008.yaml` und trugen alle dieselbe Angabe:
# `herkunft: werkzeug`, `quellen: []`. Die RFC-Regel, die handelsrechtliche
# Erinnerung und die Erfahrung mit einem Mailprogramm wirkten damit gleich
# stark und sahen in der Meldung gleich aus. Eine Meldung, die „DIN" sagt, wo
# Outlook-Praxis gemeint ist, ist von einer, die ihr Versprechen einloest, fuer
# den Empfaenger nicht zu unterscheiden.
#
# Die Quellen stehen in `quellen.yaml` — dieselbe Datei, aus der sich auch
# `din5008.yaml` bedient.
#
# ── ebene: wovon die Regel redet ───────────────────────────────────────────
#
#   norm      DIN 5008, Abschnitte 22 und 25.        darf Fehler sein
#   recht     Handelsrecht, UWG.                     hoechstens Warnung
#   technik   RFC 5322, 2045, 3676, 2047, 2231, 7763. darf Fehler sein
#   praxis    Darstellungsverhalten von Mailprogrammen. hoechstens Warnung
#   werkzeug  Der eigene Datenvertrag. Keine Aussage ueber die Welt.
#                                                    darf Fehler sein
#
# Zu `werkzeug`: ADR 0035 nennt vier Ebenen. Beim Eintragen zeigte sich, dass
# mehrere Regeln zu keiner davon gehoeren — `typ` trennt Brief und E-Mail,
# `email.profil` faengt einen Tippfehler im Profil. Sie reden ueber die
# Eingabe, nicht ueber Norm, Recht, Technik oder fremde Programme. Sie einer
# der vier Ebenen zuzuschlagen waere eine Herkunftsbehauptung, die es nicht
# gibt — genau der Fehler, den ADR 0035 abstellen soll. Deshalb die fuenfte.
# Dieselbe Ueberlegung hat schon den vierten Wert von `herkunft` erzeugt; der
# Nachtrag vom 28.08.2026 in ADR 0035 haelt es fest.
#
# `ebene` und `herkunft` sind zwei Achsen, und es gilt die schaerfere der
# beiden Grenzen: `email.pflichtangaben` ist aus Primaerquellen belegt und
# duerfte danach ein Fehler sein — die Ebene `recht` deckelt sie auf Warnung.

regeln:

  # ── Der eigene Datenvertrag ──────────────────────────────────────────────

  - id: email.typ
    titel: typ trennt Brief und E-Mail
    lint: typ
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Deckt auch die Felder des jeweils anderen Erzeugnisses ab. Ein Brief an
      eine Mailadresse und eine Mail an eine Postanschrift sind beides
      Dokumente, die niemanden erreichen.

  - id: email.datum
    titel: datum wird in einer E-Mail nicht übernommen
    lint: email.datum
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Die Kopfzeile `Date` entsteht beim Setzen der Nachricht und beschreibt
      diese, nicht den Brief, aus dem das Feld stammt (#236). Warnung statt
      Fehler, weil die Zeile aus einem Brief stammen kann, der zur Mail
      umgeschrieben wurde.

  - id: email.profil
    titel: Profil hat einen Abschnitt email
    lint: email.profil
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Deckt auch unbekannte Felder innerhalb des Abschnitts ab. Ohne die Liste
      bliebe ein Tippfehler im Profil stumm.

  - id: email.anlage
    titel: Anlage wird im Text genannt
    lint: email.anlage
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Nur ein Hinweis. Ein Werkzeug, das ungefragt Sätze in einen Brieftext
      schreibt, schreibt irgendwann den falschen — deshalb wird gemeldet und
      nicht eingefügt.

  # ── Technik: das Format schreibt es vor ──────────────────────────────────

  - id: email.an
    titel: an ist eine E-Mail-Adresse
    lint: an
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Zerlegt mit email.utils.parseaddr, nicht mit einem eigenen Ausdruck —
      die Klammerform hat mehr Fälle, als ein handgeschriebenes Muster trifft.
      Die Form prüft danach lint.adresse_grund().

      Hier stand, die Prüfung lasse Adressen ohne Empfängerteil durch. Das war
      schon damals falsch: Nach parseaddr greift EMAIL_MUSTER, und `@firma.de`
      fällt dort durch. Nachgemessen am 28.08.2026 gegen achtzehn Eingaben
      (Issue #125).
    belegt_durch:
      rfc5322: "Abschnitt 3.4.1 — Addr-Spec Specification"

  - id: email.cc
    titel: cc ist eine E-Mail-Adresse
    lint: cc
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    belegt_durch:
      rfc5322: "Abschnitt 3.4.1 — Addr-Spec Specification"

  - id: email.absender
    titel: email.absender im Profil ist eine E-Mail-Adresse
    lint: email.absender
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: Die Absenderadresse steht im Profil, nicht im einzelnen Schreiben.
    belegt_durch:
      rfc5322: "Abschnitt 3.4.1 — Addr-Spec Specification"

  - id: email.antwort_auf
    titel: antwort_auf ist eine Message-ID
    lint: antwort_auf
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: Message-IDs stehen nach RFC 5322 in spitzen Klammern.
    belegt_durch:
      rfc5322: >-
        Abschnitt 3.6.4 — Identification Fields: „The message identifier
        (msg-id) syntax is a limited version of the addr-spec construct
        enclosed in the angle bracket characters, '<' and '>'."

  # ── Recht: das Werkzeug erinnert, es prüft nicht ─────────────────────────

  - id: email.pflichtangaben
    titel: email.pflichtangaben ist gesetzt
    lint: email.pflichtangaben
    ebene: recht
    herkunft: primaerquelle
    quellen: [hgb_37a, hgb_125, gmbhg_35a, aktg_80, geng_25a, ehug]
    wirkung: warnung
    bemerkung: >-
      Nur eine Erinnerung, keine Rechtsprüfung (ADR 0005). Welche Angaben eine
      Rechtsform braucht, entscheidet nicht das Werkzeug — deshalb Warnung und
      deshalb kein Abgleich des Inhalts. Die Quellen belegen, DASS es die
      Pflicht gibt und dass sie seit dem EHUG auch für E-Mails gilt; sie
      belegen nicht, dass ein bestimmtes Profil ihr genügt.
    belegt_durch:
      hgb_37a: >-
        Absatz 1 — zählt für den eingetragenen Kaufmann Firma, Bezeichnung
        nach § 19 Abs. 1 Nr. 1, Ort der Handelsniederlassung, Registergericht
        und Registernummer auf.
      hgb_125: >-
        Absatz 1 — Firma und Sitz der Gesellschaft, Registergericht und
        Nummer. Seit dem MoPeG hier statt in § 125a.
      gmbhg_35a: >-
        Absatz 1 — „Auf allen Geschäftsbriefen gleichviel welcher Form, die an
        einen bestimmten Empfänger gerichtet werden, müssen …". Diese Wendung
        ist der Grund, aus dem die Pflicht auch für E-Mails gilt; sie steht im
        geltenden Text selbst, nicht nur im Änderungsgesetz.
      aktg_80: >-
        Absatz 1 — gleicher Wortlaut „gleichviel welcher Form".
      geng_25a: >-
        Absatz 1 — gleicher Wortlaut „gleichviel welcher Form".
      ehug: >-
        Das Änderungsgesetz, das die Wendung „gleichviel welcher Form" 2007 in
        die vier Vorschriften eingefügt hat. Historischer Beleg, nicht der
        geltende Text — den tragen die Paragrafen oben selbst. Steht hier,
        damit die Jahreszahl in docs/recht.md eine Fundstelle hat.

  # ── Praxis: Erfahrung mit Programmen, nie ein Fehler ─────────────────────

  - id: email.betreff_laenge
    titel: Betreff der E-Mail höchstens 78 Zeichen
    lint: email.betreff
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Die Begründung stand bis v0.8.1 falsch da: „Aus RFC 5322: Die Kopfzeile
      ist auf 78 Zeichen begrenzt." Das trifft nicht zu. RFC 5322 begrenzt die
      ZEILENLÄNGE einer Kopfzeile; ein längerer Betreff wird gefaltet, nicht
      abgelehnt. Was oberhalb wirklich passiert, ist eine Anzeigefrage —
      Übersichten schneiden ab, und wo genau, ist von Programm zu Programm
      verschieden. Damit ist es Praxis und keine Vorschrift, also eine Warnung.
      Die Schwelle selbst wird gesondert nachgezogen (Grenzen als Stufen).

  - id: email.anlage_groesse
    titel: Anhänge bleiben unter den Grenzen der Zielprogramme
    lint: email.anlage_groesse
    ebene: praxis
    herkunft: primaerquelle
    quellen: [microsoft_grenzen, gmail_grenzen]
    wirkung: warnung
    bemerkung: >-
      Drei Stufen statt einer Wand (Issue #183). Bis dahin stand im Prüfer eine
      einzelne Grenze von 10 MB ohne Begründung; sie war nicht falsch — das ist
      der Standardwert einer lokalen Exchange-Server-Organisation —, aber
      darüber war sofort Schluss, obwohl dieselbe Nachricht bei den meisten
      Empfängern durchgeht.

      Gemessen wird die **Nachricht**, nicht die Datei: MIME kodiert Anhänge
      base64, vier Byte je drei. Microsoft nennt denselben Aufschlag in seiner
      Grenzentabelle. Eine 9-MB-Datei wird als 12-MB-Nachricht verschickt — wer
      die Dateigröße misst, misst an der Grenze vorbei.

      Ebene `praxis`, also nie ein Fehler: Welche Grenze gilt, hängt am
      Postfach des Empfängers, und das kennt der Absender nicht.
    belegt_durch:
      microsoft_grenzen: >-
        Tabelle „Exchange Online limits", Zeile „Message size limit", Fußnote 1
        (Standard 35 MB senden / 36 MB empfangen, einstellbar 1–150 MB) und
        Fußnote 4 (10 MB als Standard einer Exchange-Server-Organisation);
        zur Kodierung „an additional 33% translation encoding increase".
      gmail_grenzen: >-
        „For personal Gmail accounts, the limit is 25 MB."

  - id: email.tabelle_spalten
    titel: Breite Tabellen tragen in einer Mail nicht
    lint: email.tabelle_spalten
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Ab fünf Spalten wird gewarnt. Die Zahl ist **keine Messung**, sondern
      eine Setzung aus Issue #104: Ein Mailfenster ist schmal, auf dem Telefon
      besonders, und eine Tabelle bricht dort in Zellen um, bis die Zeile nicht
      mehr zusammengehört. Wo die Grenze genau liegt, hängt an Fenster,
      Schriftgröße und Inhalt — deshalb eine Warnung mit einem Vorschlag und
      keine Ablehnung. Der Vorschlag ist die PDF-Anlage: Dort steht die Tabelle
      auf einer festen Breite und bleibt lesbar.

  - id: email.adresse_international
    titel: Adresse mit Zeichen ausserhalb von ASCII
    lint: email.adresse_international
    ebene: praxis
    herkunft: primaerquelle
    quellen: [rfc6531]
    wirkung: warnung
    bemerkung: >-
      RFC 6531 laesst solche Adressen zu; viele Server nehmen sie trotzdem nicht
      an. Das ist eine Aussage ueber die Praxis, nicht ueber die Technik — nach
      ADR 0035 also nie ein Fehler. Die Formpruefung laeuft davon getrennt
      weiter: `max@-oe.de` bleibt ein Fehler, auch wenn die Adresse
      international ist.
    belegt_durch:
      rfc6531: Abschnitt 3.2 — Extended Mailbox Address Syntax

  - id: email.anrede
    titel: Das Feld `anrede` trägt einen bekannten Wert
    lint: email.anrede
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Eine Aussage ueber den Datenvertrag, nicht ueber die Sprache: `sie` oder
      `du`, sonst nichts. Ein Tippfehler duerfte nicht stillschweigend als „kein
      Feld gesetzt" durchgehen — dann bliebe die Pruefung darunter wirkungslos,
      ohne dass es jemand merkt.

  - id: email.anrede_ton
    titel: Anrede im Profil und im Text gehen auseinander
    lint: email.anrede_ton
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Meldet, wenn das Profil `du` sagt und im Text gesiezt wird oder umgekehrt.
      **Geaendert wird nie etwas** — wie jemand seine Leser anspricht, entscheidet
      er selbst. Bewusst schmal: kein `Ihr` am Satzanfang, weil es dort auch das
      Possessiv der dritten Person Plural sein kann. Eine Warnung, die bei
      gueltigem Text anschlaegt, kostet Vertrauen in alle anderen.

  - id: email.versalien
    titel: Woerter in Grossbuchstaben
    lint: email.versalien
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Das liest sich wie Schreien; fuer Betonung reicht Fettdruck. Erst ab vier
      Buchstaben und ohne die bekannten Kuerzel — Rechtsformen, Bank- und
      Registerangaben stehen so im Handelsregister. Zwei- und dreistellige
      Kuerzel gibt es zu viele, um sie aufzuzaehlen.

  - id: email.logo_kontrast
    titel: Das Logo der Signatur traegt auf hellem und auf dunklem Grund
    lint: email.logo_kontrast
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Die Signatur schaltet ihre Farben um, sobald das Schema dunkel ist. Das
      Logo kann das nicht: Es ist ein Rasterbild, und ein Rasterbild traegt
      keine Medienabfrage. Gemessen wird der Anteil der sichtbaren Flaeche, der
      gegen den jeweiligen Grund 3,0:1 erreicht (WCAG 1.4.11, Erfolgskriterium
      fuer grafische Elemente); traegt weniger als die Haelfte, wird gewarnt.
      Warnung und nicht Fehler, weil der dunkle Grund selbst geschaetzt ist —
      kein Mailprogramm nennt seinen Wert. Nach ADR 0035 ist das die Ebene
      Praxis. Was das Werkzeug vorher tat: nichts. Die Anleitung sagte, das Logo
      muesse auf beiden Gruenden tragen, und niemand pruefte es (Issue #154).

  - id: email.linkziel
    titel: Ein Link zeigt auf https, http, mailto oder tel
    lint: email.linkziel
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Eine Positivliste, und das ist der Punkt: Eine Sperrliste vergisst immer
      eines. `javascript:`, `data:`, `vbscript:` und `file:` stehen deshalb
      nirgends — sie sind nicht aufgezaehlt, sie sind schlicht nicht dabei. Ein
      Verweis, der beim Empfaenger etwas ausfuehrt statt etwas zu zeigen, hat in
      einer erzeugten Nachricht nichts zu suchen. Im Brief bleibt jeder Link ein
      Fehler: Auf Papier gibt es nichts zum Anklicken (Issue #103).

  - id: email.linktext
    titel: Der Linktext sagt, wohin er fuehrt
    lint: email.linktext
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      „hier" und „klicken Sie hier" sagen nichts. Ein Bildschirmleseprogramm
      liest Links oft als Liste vor, losgeloest vom Satz drumherum — dort ist
      „hier" nichts. Eine Aussage ueber die Lesbarkeit, nach ADR 0035 also nie
      ein Fehler; geaendert wird der Text nie, denn wie jemand formuliert,
      entscheidet er selbst.

  - id: email.linkschema
    titel: Unverschluesselte und verkuerzte Adressen
    lint: email.linkschema
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      Zwei Faelle, eine Regel. `http://` uebertraegt unverschluesselt — wenn es
      die Seite auch als `https://` gibt, gehoert die dorthin. Ein
      Kurz-URL-Dienst verbirgt das Ziel, und ein Empfaenger, der nicht sieht,
      wohin es geht, klickt zu Recht nicht. Beides ist Praxis und keine
      Vorschrift. Die Liste der Dienste ist nicht vollstaendig und soll es nicht
      sein — sie faengt die haeufigen.

  - id: email.floskel
    titel: Wendungen, die nichts sagen
    lint: email.floskel
    ebene: praxis
    herkunft: werkzeug
    quellen: []
    wirkung: warnung
    bemerkung: >-
      „Ich hoffe, diese E-Mail erreicht Sie wohlauf" und Verwandtes sind nicht
      falsch, sie sind leer: Die Zeile liesse sich streichen, ohne dass die
      Nachricht etwas verloere. Genau das ist die Aufnahmebedingung der Liste,
      und sie ist eng gemeint — „vielen Dank fuer die Unterlagen" steht nicht
      drin, „vielen Dank fuer Ihre Zeit" schon.

      Warnung und nie Fehler: Ob ein Satz leer ist, ist eine Aussage ueber den
      Stil, nicht ueber die Technik (ADR 0035). Geaendert wird nichts — wie
      jemand schreibt, entscheidet er selbst.

  - id: email.brief
    titel: Das Feld `brief` zeigt auf eine Markdown-Quelle
    lint: brief
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Eine Aussage ueber den Datenvertrag. `brief:` nennt die QUELLE des
      Schreibens, nicht sein PDF — gesetzt wird es beim Bauen der Nachricht, und
      genau daran haengt die Zusage aus Issue #78: Ein veraltetes PDF kann nicht
      mitreisen, weil es keines gibt, das aelter waere als dieser Aufruf. Wer
      ein fertiges PDF anhaengen will, nimmt `anlagen_dateien:`; die Meldung
      sagt das.

  # ══ Die fertige Datei: Pruefungen aus pruefung_eml.py (#292) ══════════════
  #
  # Alle Regeln oben tragen `lint:` und beschreiben die EINGABE — Frontmatter
  # und Markdown. Die Pruefungen in `pruefung_eml.py` messen dagegen die fertige
  # `.eml`, und fuer sie gab es bis #292 keinen einzigen Eintrag. Folge: Sie
  # wirkten alle als Fehler, weil `deckel(None)` vorsichtshalber `fehler`
  # zurueckgibt — auch die, deren Regel nur Erfahrung mit Mailprogrammen ist.
  # Genau daran ist die Lesebreite in #289 gestorben.
  #
  # `pruefung:` ist die dritte Achse neben `lint:` und `typografie:`. Der Wert
  # ist der Regelname, den `pruefung_eml` meldet.
  #
  # WAS SICH DADURCH NICHT AENDERT: Keine dieser Pruefungen wird milder. Die
  # technischen sind durch RFCs belegt (Primaerquelle, darf Fehler sein), die
  # uebrigen sind Zusagen des Werkzeugs (ADR 0034). Der Gewinn ist nicht eine
  # andere Wirkung, sondern eine begruendete: Wer die naechste Pruefung
  # hinzufuegt, muss sagen, wovon sie redet — und eine Regel auf der Ebene
  # `praxis` kann dann warnen, statt als Fehler zu wirken oder zu fehlen.

  # ── Aufbau der Nachricht ─────────────────────────────────────────────────

  - id: eml.textteil
    titel: Die Nachricht hat einen Textteil
    pruefung: textteil
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      ADR 0034, Punkt 1: Jede Nachricht traegt beide Fassungen. Ein Client ohne
      HTML bekommt sonst eine leere Mail.

  - id: eml.htmlteil
    titel: Die Nachricht hat einen HTML-Teil
    pruefung: htmlteil
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: Die Gegenrichtung zu `eml.textteil`, aus demselben Grund.

  - id: eml.alternativen_reihenfolge
    titel: Der HTML-Teil steht hinter dem Textteil
    pruefung: alternativen_reihenfolge
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc2046]
    wirkung: fehler
    bemerkung: >-
      In `multipart/alternative` gilt der LETZTE Teil als der reichste. Stuende
      der Klartext hinten, zeigte jeder Client ihn statt des HTML.
    belegt_durch:
      rfc2046: >-
        Abschnitt 5.1.4 — Alternative Subtype: „the alternatives appear in an
        order of increasing faithfulness to the original content. In general,
        the best choice is the LAST part of a type supported by the recipient
        system's local environment."

  - id: eml.kopfzeilen
    titel: From, To und Subject sind gesetzt
    pruefung: kopfzeilen
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Eine Nachricht ohne Absender oder Empfaenger ist keine. `Subject` ist nach
      RFC 5322 optional, hier aber Pflicht: Eine Geschaeftsmail ohne Betreff
      laesst sich beim Empfaenger nicht wiederfinden.
    belegt_durch:
      rfc5322: >-
        Abschnitt 3.6.2 — Originator Fields und 3.6.3 — Destination Address
        Fields; `Subject` steht in 3.6.5 als optional und ist hier eine Zusage
        des Werkzeugs.

  - id: eml.message_id
    titel: Die Nachricht traegt keine Message-ID
    pruefung: message_id
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Eine Message-ID gehoert dem Versender: Sie muss eindeutig sein, und das
      kann nur garantieren, wer die Nachricht tatsaechlich abschickt. falzmarke
      setzt deshalb keine — ein Entwurf, der zweimal gesendet wird, truege sonst
      zweimal dieselbe.
    belegt_durch:
      rfc5322: >-
        Abschnitt 3.6.4 — Identification Fields: „The generator of the message
        identifier MUST guarantee that the msg-id is unique."

  - id: eml.date
    titel: Die Nachricht traegt ein Date
    pruefung: date
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Bis #236 trug keine Nachricht ein `Date`, und `verify --email` meldete sie
      trotzdem gruen — die Pruefung konnte an dieser Stelle nicht rot werden.
    belegt_durch:
      rfc5322: >-
        Abschnitt 3.6.1 — The Origination Date Field; das Feld ist in der
        Tabelle in Abschnitt 3.6 als erforderlich geführt.

  - id: eml.date_lesbar
    titel: Das Date ist nach RFC 5322 lesbar
    pruefung: date_lesbar
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc5322]
    wirkung: fehler
    bemerkung: >-
      Vorhanden und lesbar sind zwei Dinge. Ein Datum in eigener Schreibweise
      stuende da, ohne dass ein Mailprogramm es einordnen koennte.
    belegt_durch:
      rfc5322: "Abschnitt 3.3 — Date and Time Specification"

  # ── Der Textteil ─────────────────────────────────────────────────────────

  - id: eml.charset_text
    titel: Der Textteil ist als UTF-8 ausgezeichnet
    pruefung: charset_text
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc2045]
    wirkung: fehler
    belegt_durch:
      rfc2045: >-
        Abschnitt 5.1 — Syntax of the Content-Type Header Field: „the `charset`
        parameter is applicable to any subtype of `text`".

  - id: eml.transfer_encoding
    titel: Der Textteil ist quoted-printable kodiert
    pruefung: transfer_encoding
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc2045]
    wirkung: fehler
    bemerkung: >-
      Nicht base64: Eine Nachricht, die ein Mensch im Quelltext lesen kann,
      laesst sich pruefen. `format=flowed` waere in base64 ausserdem unsichtbar.
    belegt_durch:
      rfc2045: >-
        Abschnitt 6.7 — Quoted-Printable Content-Transfer-Encoding: „intended to
        represent data that largely consists of octets that correspond to
        printable characters in the US-ASCII character set."

  - id: eml.flowed
    titel: Der Textteil traegt format=flowed
    pruefung: flowed
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc3676]
    wirkung: fehler
    bemerkung: >-
      Ein Brief kennt seine Breite, eine Mail nicht. Wer hart auf 72 Zeichen
      umbricht, erzeugt auf einem Telefon den Treppenschnitt; wer gar nicht
      umbricht, eine Zeile mit Querbalken. Flowed loest beides.
    belegt_durch:
      rfc3676: >-
        Abschnitt 4 — The Format and DelSp Parameters: „A Format value of Flowed
        indicates that the definition of flowed text (as specified in this memo)
        was used on generation."

  - id: eml.delsp
    titel: delsp ist gesetzt
    pruefung: delsp
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc3676]
    wirkung: fehler
    bemerkung: >-
      Beide Wege sind gebaut und werden gegen ihre Umkehrung geprueft;
      `delsp=yes` ist die Vorgabe. Ungesetzt waere der Wert `No` — und dann
      stuende in der Datei etwas anderes, als der Erzeuger gerechnet hat.
    belegt_durch:
      rfc3676: >-
        Abschnitt 4 — The Format and DelSp Parameters: „If DelSp is not
        specified, or if its value is not recognized, a value of No is assumed."

  - id: eml.space_stuffing
    titel: Zeilen, die Schutz brauchen, sind space-stuffed
    pruefung: space_stuffing
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc3676]
    wirkung: fehler
    bemerkung: >-
      Ohne das Schutzleerzeichen liest ein Client eine Zeile, die mit `>`
      beginnt, als Zitat — und eine, die mit `From ` beginnt, als Anfang einer
      neuen Nachricht.
    belegt_durch:
      rfc3676: >-
        Abschnitt 4.4 — Space-Stuffing: „Space-stuffing adds a single space to
        the start of any line which needs protection when the message is
        generated."

  - id: eml.signaturtrenner
    titel: Vor der Signatur steht die Trennzeile
    pruefung: signaturtrenner
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc3676]
    wirkung: fehler
    bemerkung: >-
      Zwei Striche und ein Leerzeichen. Clients schneiden daran ab, wenn jemand
      antwortet — fehlt die Zeile, reist die Signatur durch den ganzen Faden.
    belegt_durch:
      rfc3676: >-
        Abschnitt 4.3 — Usenet Signature Convention: „a long-standing convention
        … of using \"-- \" as the separator line between the body and the
        signature."

  # ── Der HTML-Teil ────────────────────────────────────────────────────────

  - id: eml.charset_html
    titel: Der HTML-Teil ist als UTF-8 ausgezeichnet
    pruefung: charset_html
    ebene: technik
    herkunft: primaerquelle
    quellen: [rfc2045]
    wirkung: fehler
    belegt_durch:
      rfc2045: "Abschnitt 5.1 — Syntax of the Content-Type Header Field"

  - id: eml.verbotene_bestandteile
    titel: Keine Skripte, externen Stylesheets oder fremden Quellen
    pruefung: verbotene_bestandteile
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      ADR 0034, Punkt 4. Geprueft wird mit derselben Funktion, die der Emitter
      an sich selbst anlegt — zwei Fassungen derselben Regel laufen auseinander.

  - id: eml.sprache
    titel: Der HTML-Teil zeichnet seine Sprache aus
    pruefung: sprache
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Ohne `lang` liest ein Screenreader den deutschen Text mit englischer
      Aussprache vor. Eine Zusage des Werkzeugs, keine Normaussage — deshalb
      `werkzeug` und keine erfundene Quelle.

  - id: eml.breitendeckel_text
    titel: Der Fliesstext traegt keinen Breitendeckel
    pruefung: breitendeckel_text
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die Gegenrichtung aus #289: Bis dahin VERLANGTE die Pruefung einen Deckel
      von 640 px, und diese Zahl hatte keine Quelle. Jetzt haelt sie fest, dass
      er nicht stillschweigend zurueckkommt. Gemessen werden nur die eigenen
      Bloecke (`fm-t`) — eine mitgebrachte Signatur behaelt ihre Breite.

  - id: eml.breitendeckel_umschlag
    titel: Der Umschlag traegt keinen Breitendeckel
    pruefung: breitendeckel_umschlag
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Der Befund aus #264: Ein Deckel am Umschlag quetscht alles darin. Gemessen
      am 08.09.2026 in Outlook fuer Mac brach die Kopfzelle „Datum" mitten im
      Wort, waehrend das Fenster doppelt so breit war.

  - id: eml.zaehlpixel
    titel: Kein Zaehlpixel
    pruefung: zaehlpixel
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Ein 1x1-Bild ist keine Abbildung, sondern eine Messung am Empfaenger.
      ADR 0034, Punkt 4.

  - id: eml.tabellenart
    titel: Jede Tabelle ist Daten oder gekennzeichnetes Layout
    pruefung: tabellenart
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Issue #104: Ohne `role="presentation"` liest ein Screenreader eine
      Layouttabelle als Datensatz vor. Umgekehrt gilt dasselbe — eine Tabelle
      ohne `<th>` UND ohne die Marke ist ein Befund, egal welche Absicht
      dahinterstand.

  - id: eml.quellteil
    titel: Der Quellteil ist als CommonMark ausgezeichnet
    pruefung: quellteil
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Nur vorhanden, wenn `--mit-quelle` gesetzt ist (ADR 0034, Punkt 3). Dann
      aber richtig ausgezeichnet, sonst weiss ein Empfaenger nicht, welchen
      Dialekt er vor sich hat.

  - id: eml.anhang_name
    titel: Jeder Anhang traegt einen Dateinamen
    pruefung: anhang_name
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Ein Anhang ohne Namen erscheint beim Empfaenger als „Unbenannt" und
      laesst sich nicht zuordnen.

  # ── Blindkopie (#242) ────────────────────────────────────────────────────

  - id: eml.bcc_auswertbar
    titel: Die Blindkopie steht auswertbar im Kopf
    pruefung: bcc_auswertbar
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die eine Zusage des Feldes: Was als Blindkopie gesetzt ist, muss ein
      Mailprogramm auch als solche lesen koennen.

  - id: eml.bcc_verschwiegen
    titel: Die Blindkopie steht nicht im sichtbaren Teil
    pruefung: bcc_verschwiegen
    ebene: werkzeug
    herkunft: werkzeug
    quellen: []
    wirkung: fehler
    bemerkung: >-
      Die andere Haelfte, und die wichtigere: Steht die Adresse im Text, ist sie
      keine Blindkopie mehr. Das fiele sonst niemandem auf, weil die Nachricht
      in jeder anderen Hinsicht stimmt.
