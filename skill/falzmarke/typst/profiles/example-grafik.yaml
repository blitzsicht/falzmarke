# Beispielprofil mit Bildern — Logo im Briefkopf, Unterschrift über dem Namen.
#
# Der Unterschied zu example.yaml sind genau die beiden Zeilen `logo:` und
# `signatur:`. Beide Pfade sind relativ zu DIESER Datei; ein Profil mit Bildern
# lässt sich deshalb nur samt seinem assets-Ordner an einen anderen Ort kopieren.
# Wer ein Profil ohne Nachbardateien braucht, nimmt example.yaml.
#
# WARUM HIER DAS LOGO DES WERKZEUGS STEHT (Issue #97)
#
# Vorher trug dieses Profil ein frei erfundenes Logo der „Beispiel GmbH". Aus
# diesem Profil entstehen die Schaufenster-Bilder in docs/renders/, und wer sie
# auf der Produktseite sieht, liest das Logo als Marke — entweder als die des
# Werkzeugs oder als fremdes Branding. Beides war falsch, und man sah es dem
# Platzhalter nicht an.
#
# Jetzt ist es die Marke des Werkzeugs, und damit stimmt, was jemand liest.
#
# DIE ANSCHRIFT IST ERFUNDEN, UND ZWAR ERKENNBAR. falzmarke ist ein
# Softwareprojekt und hat keine Postanschrift; ein Brief braucht eine. Deshalb
# steht hier die Musteradresse, die auch die Beispielbriefe verwenden — Musterweg
# in 12345 Musterstadt gibt es nicht, und das ist der Punkt. Echt sind nur die
# Angaben, die es wirklich gibt: die Projektadresse und die Lizenz.

absender:
  name: falzmarke
  strasse: Musterweg 12
  plz: "12345"
  ort: Musterstadt

# Einzeilig, erscheint 7 pt und unterstrichen über dem Anschriftfeld.
ruecksendeangabe: falzmarke · Musterweg 12 · 12345 Musterstadt

# Voreinstellung, im Brief mit `form:` überschreibbar.
form: B

# Schrift: leer lassen für Libertinus Serif (bringt Typst mit).
# "Source Sans 3" liegt unter skill/assets/fonts/ bereit.
font: Libertinus Serif
# Tinte aus dem Erscheinungsbild — dieselbe Farbe wie im Logo.
farbe: "#121E2F"

briefkopf:
  logo: assets/falzmarke-logo.svg   # ersetzt den Namen links im Briefkopf
  logo_hoehe_mm: 14
  zeilen:
    - falzmarke
    - Musterweg 12 · 12345 Musterstadt
    - Telefon 0941 620-9800

# Jede Liste ist eine Spalte der Fußzeile.
# Jede Liste ist eine Spalte. Bankverbindung und Handelsregister stehen hier
# NICHT: Ein Softwareprojekt hat weder das eine noch das andere, und erfundene
# Kontodaten in einem Schaufenster-Bild wären genau die Sorte Behauptung, gegen
# die dieses Werkzeug antritt. Die vierspaltige Fußzeile zeigt brief-form-b.md
# mit example.yaml.
fusszeile:
  - - falzmarke
    - Musterweg 12
    - 12345 Musterstadt
  - - Telefon 0941 620-9800
    - falzmarke.com
    - github.com/blitzsicht/falzmarke
  - - MIT-Lizenz
    - "Anschrift: Beispiel"

# lang -> "25. August 2026" · iso -> "2026-08-25"
datumsformat: lang

# Über dem Unterzeichner. Ohne diese Zeile bleiben drei Leerzeilen Raum.
signatur: assets/unterschrift.svg

gruss: Mit freundlichen Grüßen
# Bleibt eine Beispielperson: Die Briefe darunter sind Formbeispiele — Mahnung,
# Einschreiben, Tabelle —, kein Schriftverkehr des Projekts. Ein realer Name
# darunter würde das behaupten.
unterzeichner: Erika Muster
firma_ueber_unterschrift: false

# Werden in den Informationsblock übernommen, wenn der Brief nichts anderes sagt.
infoblock_defaults:
  ansprechpartner: Erika Muster
  telefon: 0941 620-9800
  email: post@example.de
