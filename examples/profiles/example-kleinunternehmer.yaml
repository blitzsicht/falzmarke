# Beispielprofil eines Kleinunternehmers (§ 19 UStG, ADR 0041) — für
# examples/rechnung-kleinunternehmer.md. Abgeleitet aus dem mitgelieferten
# example.yaml; anders sind nur die Fußzeile (Steuernummer statt USt-IdNr.) und
# der Abschnitt `rechnung:`.
# Echte Absenderdaten gehören nach profiles.local/ (gitignored) oder in ein
# privates Repository, nie hierher.

absender:
  name: Beispiel GmbH
  strasse: Musterweg 12
  plz: "93055"
  ort: Regensburg

# Einzeilig, erscheint 7 pt und unterstrichen über dem Anschriftfeld.
ruecksendeangabe: Beispiel GmbH · Musterweg 12 · 93055 Regensburg

# Voreinstellung, im Brief mit `form:` überschreibbar.
form: B

# Schrift: leer lassen für Libertinus Serif (bringt Typst mit).
# "Source Sans 3" liegt unter skill/assets/fonts/ bereit.
font: Libertinus Serif
farbe: "#1a3a5c"

briefkopf:
  # logo: assets/logo.svg   # relativ zum Profilverzeichnis, PNG oder SVG
  # logo_hoehe_mm: 14       # wirkt nur zusammen mit logo:
  # Ein Profil mit Logo und Unterschrift zeigt example-grafik.yaml.
  zeilen:
    - Beispiel GmbH
    - Musterweg 12 · 93055 Regensburg
    - Telefon 0941 620-9800

# Jede Liste ist eine Spalte der Fußzeile.
fusszeile:
  - - Beispiel GmbH
    - Musterweg 12
    - 93055 Regensburg
  - - Telefon 0941 620-9800
    - info@example.de
    - www.example.de
  - - Sparkasse Regensburg
    - IBAN DE62 7625 1020 0221 0217 44
    - BIC BYLADEM1RBG
  - - Amtsgericht Regensburg HRB 12345
    - Steuernummer 244/107/01234
    - "Geschäftsführerin: Erika Muster"   # Doppelpunkt: Anführungszeichen nötig

# lang -> "25. August 2026" · iso -> "2026-08-25"
datumsformat: lang

gruss: Mit freundlichen Grüßen
unterzeichner: Erika Muster
firma_ueber_unterschrift: false

# Werden in den Informationsblock übernommen, wenn der Brief nichts anderes sagt.
# Für die E-Mail-Fassung (ADR 0034). Fehlt der Abschnitt, meldet `lint` das,
# sobald ein Schreiben `typ: email` trägt — Briefe berührt er nicht.
email:
  absender: muster@example.de
  anzeigename: Erika Muster
  position: Geschäftsführerin
  web: www.example.de
  datenschutz: https://example.de/datenschutz
  pflichtangaben: fusszeile
  zusatz:
    - Diese E-Mail enthält vertrauliche Informationen.
  logo: false

infoblock_defaults:
  ansprechpartner: Erika Muster
  telefon: 0941 620-9800
  email: muster@example.de

# Für die Rechnungsfassung (`typ: rechnung`). Nur die Angaben, die ein Brief
# nicht braucht: Name, Straße, PLZ und Ort stehen schon oben unter `absender:`
# und werden von dort gelesen — doppelt gepflegt liefen sie auseinander.
#
# In der Fußzeile steht die USt-IdNr. ebenfalls, als Text. Das ist die Fassung
# für Menschen; aus ihr ein Feld zu parsen wäre eine stille Ableitung, und die
# eingebettete XML braucht den Wert einzeln.
rechnung:
  steuernummer: 244/107/01234
  land: DE
  # Die Umsätze sind nach § 19 Absatz 1 UStG steuerfrei. Die XML trägt dann
  # Kategorie E mit Satz 0, das PDF nur den Gesamtbetrag. Ob die Grenzen
  # eingehalten sind, weiß falzmarke nicht — das verantwortet der Absender.
  kleinunternehmer: true
  # Pflicht bei `kleinunternehmer: true`: der Hinweis nach § 34a Nr. 5 UStDV,
  # dass die Steuerbefreiung für Kleinunternehmer gilt. falzmarke gibt keinen
  # Wortlaut vor und bewertet diesen nicht. Er steht im PDF unter der Tabelle
  # und in der XML als BT-120 und BT-33.
  kleinunternehmer_hinweis: Steuerfreie Kleinunternehmerleistung nach § 19 UStG.
  bank:
    iban: DE62 7625 1020 0221 0217 44
    bic: BYLADEM1RBG
  adresse: rechnung@example.de
