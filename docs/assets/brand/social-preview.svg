<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="falzmarke — Geschäftsbriefe nach DIN 5008 aus Markdown">
  <title>falzmarke</title>
  <!-- Quelle des GitHub-Social-Previews (1280×640).
       Gerendert mit: rsvg-convert -w 1280 -h 640 social-preview.svg > social-preview.png
       Das Briefbild rechts kommt aus docs/renders/ und wird beim Rendern eingebettet. -->

  <rect width="1280" height="640" fill="#1D1E3B"/>

  <!-- Der gerenderte Brief, rechts angeschnitten -->
  <g>
    <rect x="800" y="72" width="400" height="568" fill="#FFFFFF" opacity="0.06"/>
    <image x="800" y="72" width="400" height="568"
           preserveAspectRatio="xMidYMin slice"
           xlink:href="../../renders/brief-form-b.png"/>
  </g>

  <!-- Wortmarke: dasselbe Zeichen wie in logo-dark.svg, groesser gesetzt -->
  <g transform="translate(100 148) scale(1.34)">
    <g transform="translate(8 8)">
      <rect x="10" y="0" width="66" height="94" rx="2" fill="#F6F7FB" stroke="#3D4463" stroke-width="1.6"/>
      <g stroke="#AAB2CC" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="33.2" x2="8" y2="33.2"/>
        <line x1="0" y1="47.0" x2="9.5" y2="47.0"/>
        <line x1="0" y1="66.5" x2="8" y2="66.5"/>
      </g>
      <rect x="20" y="14" width="30" height="17" rx="1" fill="none" stroke="#AAB2CC" stroke-width="1.2" opacity="0.55"/>
      <g stroke="#AAB2CC" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
        <line x1="20" y1="42" x2="52" y2="42"/>
      </g>
      <g stroke="#AAB2CC" stroke-width="1.6" stroke-linecap="round" opacity="0.4">
        <line x1="20" y1="52" x2="66" y2="52"/>
        <line x1="20" y1="59" x2="66" y2="59"/>
        <line x1="20" y1="66" x2="58" y2="66"/>
      </g>
      <g transform="translate(52 66)">
        <circle cx="12" cy="12" r="12" fill="#4FBF80"/>
        <path d="M6 12.4 L10.3 16.6 L18.2 7.8" fill="none" stroke="#F6F7FB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <text x="227" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="600" letter-spacing="-0.9" fill="#F2F4F9">falzmarke</text>
  <text x="230" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="0.2" fill="#AAB2CC" opacity="0.95">DIN 5008 aus Markdown · gerendert und nachgemessen</text>

  <text x="100" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" fill="#F2F4F9" opacity="0.92">Geschäftsbriefe nach DIN 5008 aus Markdown —</text>
  <text x="100" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" fill="#F2F4F9" opacity="0.92">als PDF/A gerendert und geometrisch geprüft.</text>

  <g font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="19" fill="#4FBF80">
    <text x="100" y="434">OK  Falzmarke 1, y: soll 105.00 ist 105.00</text>
    <text x="100" y="465">OK  Anschrift, erste Zeile y: soll ≥ 62.7 ist 62.19</text>
    <text x="100" y="496">OK  Abstand Betreff → Anrede: soll 12.70 ist 12.70</text>
  </g>
</svg>
