<!-- Bildzeichen falzmarke, Fassung fuer sehr kleine Groessen (16-24 px).
     ABGELEITET, NICHT NEU GEZEICHNET: dieselbe Form wie bildzeichen.svg, nur mit
     einer Kontur von 12 Einheiten in der Blattfarbe. Nichts ist umgefaerbt,
     nichts verzerrt.

     Warum es sie gibt — gemessen am gerenderten Bild:
     Die zwei senkrechten Marken sind 20,4 Einheiten breit. Bei 16 px sind das
     0,70 px, also weniger als ein Pixel: Sie erscheinen als blasser Fleck, nicht
     als Strich. Mit der Kontur werden daraus 32,4 Einheiten = 1,12 px.

     Warum 12 und nicht mehr: Bei 18 laeuft die geknickte Ecke zu — genau das
     Detail, das das Zeichen ausmacht. Nachgesehen bei 16, 24 und 32 px.

     NUR bis 24 px verwenden. Darueber ist bildzeichen.svg richtig; dort traegt
     die Kontur nichts bei und macht die Ecke nur stumpf.
     Siehe docs/marke/erscheinungsbild.md. -->
<svg version="1.1" role="img" aria-label="falzmarke Bildzeichen, kleine Fassung" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="39.01 -17.17 463.58 463.58" xml:space="preserve">
<title>falzmarke Bildzeichen, kleine Fassung</title>
<style type="text/css">
	.st0{fill:#121E2F;}
	.st1{fill:#3EB057;}
	.st2{fill:#FFFFFF;}
	.st-mark{stroke:#121E2F;}
	/* Auf dunklem Grund kehrt sich Tinte zu Papier um — beide Farben stehen
	   schon in der Palette, es kommt keine neue dazu. Das gruene Dreieck und
	   der weisse Haken darin bleiben, wie sie sind: Gruen traegt auf beiden
	   Gruenden (6,00:1 auf dunkel, 2,78:1 auf hell, und es ist Flaeche, kein
	   Text).

	   Wirkt dort, wo der Browser das SVG als Favicon nimmt und die Medienabfrage
	   darin auswertet — Firefox und Safari tun das, Chrome nur teilweise. Das
	   ICO kann es grundsaetzlich nicht: Bitmaps tragen keine Medienabfrage.
	   Siehe docs/marke/erscheinungsbild.md. */
	@media (prefers-color-scheme: dark) {
		.st0{fill:#FFFFFF;}
		.st-mark{stroke:#FFFFFF;}
	}
</style>
