# Selbsttest der Aktion aus action.yml.
#
# Eine Aktion, die niemand ausfuehrt, ist ungeprueft: Ihre Eingaben, ihr
# Dateimuster und ihre Fehlerbehandlung zeigen sich erst im Lauf. Dieses
# Repository benutzt sie deshalb auf seinen eigenen Beispielbriefen.
#
# Zwei Wege, weil beide gebraucht werden:
#
#   selbsttest  installiert den Code DIESES Zweiges (`paket: "."`). Nur so
#               deckt er Beispiele ab, die neuere Felder benutzen als die
#               letzte Veroeffentlichung.
#   mit-pypi    installiert die veroeffentlichte Fassung und prueft damit den
#               Weg, den fremde Repositories gehen.
#
# Der zweite Job braucht einen eigenen Brief. Die Beispiele im Repository
# laufen der Veroeffentlichung voraus: Am 26.08.2026 scheiterte dieser
# Selbsttest daran, dass `examples/brief-englisch.md` das Feld `sprache`
# benutzt, das v0.7.3 noch nicht kennt (#11 war gemergt, aber nicht
# veroeffentlicht). Das ist kein Fehler der Aktion — aber ein Grund, den
# PyPI-Weg an etwas zu pruefen, das sich nicht mit dem Repository bewegt.

name: Aktion

on:
  push:
    branches: [main]
    paths: ['action.yml', '.github/workflows/aktion.yml']
  pull_request:
    paths: ['action.yml', '.github/workflows/aktion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbsttest:
    name: Aktion auf den eigenen Beispielen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: lauf
        uses: ./
        with:
          briefe: "examples/*.md"
          profile: "skill/falzmarke/typst/profiles"
          ausgabe: "aus"
          vorschau: "true"
          artefakt: "beispielbriefe"
          # Der Code dieses Zweiges, nicht die letzte Veroeffentlichung.
          paket: "."

      - name: Ergebnis nachzaehlen
        shell: bash
        run: |
          set -euo pipefail
          # Über ein Array statt `ls | wc -l`: Ein Dateiname mit Zeilenumbruch
          # würde sonst doppelt gezählt, und die Prüfung meldete eine Zahl, die
          # es nicht gibt (shellcheck SC2012).
          shopt -s nullglob
          briefe=(examples/*.md)
          erwartet=${#briefe[@]}
          gemeldet="${{ steps.lauf.outputs.anzahl }}"
          [ "$gemeldet" = "$erwartet" ] || {
            echo "::error::Aktion meldet $gemeldet Briefe, es sind $erwartet"; exit 1; }

          pdfs=(aus/*.pdf)
          [ "${#pdfs[@]}" = "$erwartet" ] || {
            echo "::error::${#pdfs[@]} PDFs statt $erwartet"; exit 1; }

          pngs=(aus/*.png)
          [ "${#pngs[@]}" -gt 0 ] || { echo "::error::vorschau=true, aber kein PNG"; exit 1; }

          echo "OK  $gemeldet Briefe, ${#pdfs[@]} PDFs, ${#pngs[@]} Vorschauen"

  mit-pypi:
    name: Der Weg, den fremde Repositories gehen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Ein eigener Brief statt examples/: Der benutzt nur Pflichtfelder und
      # bewegt sich damit nicht mit dem Repository. Ein Beispiel, das ein
      # neues Feld benutzt, wuerde diesen Job bei jeder Neuerung rot faerben,
      # ohne dass an der Aktion etwas falsch waere.
      - name: Brief nur aus Pflichtfeldern
        shell: bash
        run: |
          mkdir -p probe
          cat > probe/brief.md <<'BRIEF'
          ---
          profil: example
          datum: 2026-08-26
          empfaenger:
            - Muster GmbH
            - Frau Erika Muster
            - Musterstraße 1
            - 12345 Musterstadt
          betreff: Probelauf der Aktion
          anrede: Sehr geehrte Frau Muster,
          ---

          dieser Brief prüft den Installationsweg über PyPI.

          Mit freundlichen Grüßen
          BRIEF

      - uses: ./
        with:
          briefe: "probe/*.md"
          ausgabe: "aus-pypi"
          artefakt: ""

      - name: PDF vorhanden
        shell: bash
        run: |
          [ -f aus-pypi/brief.pdf ] || { echo "::error::kein PDF"; exit 1; }
          echo "OK  PyPI-Weg trägt"

  gegenprobe:
    name: Ohne Treffer muss sie fehlschlagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Ohne diesen Job belegte der Selbsttest nur, dass die Aktion bei gutem
      # Wetter laeuft. Ein Muster ohne Treffer MUSS abbrechen — stillschweigend
      # null Briefe zu rendern und gruen zu melden waere der teuerste Ausgang:
      # Der Betreiber glaubt, seine Briefe seien gesetzt und geprueft.
      - id: leer
        continue-on-error: true
        uses: ./
        with:
          briefe: "gibt-es-nicht/*.md"
          ausgabe: "leer"
          artefakt: ""

      - name: Fehlschlag verlangen
        shell: bash
        run: |
          if [ "${{ steps.leer.outcome }}" != "failure" ]; then
            echo "::error::Die Aktion lief ohne einen einzigen Brief durch (${{ steps.leer.outcome }})."
            exit 1
          fi
          echo "OK  leeres Muster bricht ab, wie es soll"
