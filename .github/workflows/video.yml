name: Video

# Zeichnet das README-GIF neu auf, wenn sich etwas aendert, das darin zu sehen
# ist: das Tape selbst, der gezeigte Beispielbrief oder die CLI, deren Ausgabe
# im Bild steht. Ein Demo-Bild altert sonst still — jemand aendert eine
# Ausgabezeile, und im README laeuft monatelang ein Terminal, das es nie gab.
#
# Der Erklaerfilm wird hier NICHT gerendert. Er entsteht lokal, wie jedes andere
# Video im Haus; dieser Lauf misst nur die eingecheckten Dateien.
#
# Alle Actions sind auf Commit-SHAs gepinnt, nicht auf Tags. Ein Tag laesst sich
# verschieben; wer ihn kontrolliert, bekaeme hier Code in den Lauf, der die
# Aufnahme erzeugt, die spaeter im README steht. Das wiegt bei
# charmbracelet/vhs-action besonders schwer — sie ist die einzige Action hier,
# die nicht von GitHub selbst kommt. Die Version steht als Kommentar daneben,
# damit beim Aktualisieren sichtbar bleibt, was gepinnt ist.
#
# Der Job hatte bis zum 30.08.2026 `contents: write` und schrieb die Aufnahme
# direkt auf main. Beides ist weg — die Begruendung steht beim letzten Schritt.

on:
  push:
    branches: [main]
    paths:
      - "docs/marke/video/readme.tape"
      - "examples/brief-mahnung.md"
      - "skill/falzmarke/**"
      - ".github/workflows/video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: falzmarke installieren
        run: |
          python -m pip install --upgrade pip
          pip install .
          falzmarke --version

      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf  # v2.1.1
        with:
          path: docs/marke/video/readme.tape

      - name: Ausgaben pruefen
        run: |
          set -e
          for datei in docs/renders/demo.gif docs/renders/demo.mp4 docs/renders/demo.ascii; do
            test -s "$datei" || { echo "FEHLER: $datei fehlt oder ist leer"; exit 1; }
          done
          # GitHub spielt groessere GIFs nicht mehr von allein ab.
          groesse=$(stat -c%s docs/renders/demo.gif)
          echo "demo.gif: $((groesse / 1024)) KB"
          test "$groesse" -le 5242880 || { echo "FEHLER: GIF ueber 5 MB"; exit 1; }
          mp4=$(stat -c%s docs/renders/demo.mp4)
          echo "demo.mp4: $((mp4 / 1024)) KB"
          test "$mp4" -le 10485760 || { echo "FEHLER: MP4 ueber 10 MB"; exit 1; }

      - name: Mitschnitt gegen die echte CLI halten
        run: |
          pip install pytest
          python -m pytest tests/test_tape.py -q

      - name: Aufzeichnung als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: aufzeichnung
          path: |
            docs/renders/demo.gif
            docs/renders/demo.mp4
            docs/renders/demo.ascii
          if-no-files-found: error

      # Warum hier nichts mehr auf main geschrieben wird (Issue #188)
      #
      # Bis zum 30.08.2026 committete dieser Schritt die Aufnahme direkt auf
      # main. Damit konnte das Ruleset `main` nie auf `active`: Ein Ruleset
      # gilt fuer ALLE Akteure ohne Bypass, das GITHUB_TOKEN eingeschlossen,
      # und die Actions-App laesst sich nicht als Bypass eintragen — GitHub
      # antwortet mit 422 "Actor GitHub Actions integration must be part of
      # the ruleset source or owner organization". Sie ist keine INSTALLIERTE
      # App.
      #
      # Ein Bot-PR statt eines Bot-Pushes waere keine Loesung, sondern eine
      # Sackgasse: Ein mit dem GITHUB_TOKEN erzeugter PR loest keine
      # Workflow-Laeufe aus (GitHubs Rekursionsbremse — derselbe Mechanismus,
      # der den frueheren "[skip ci]"-Marker hier ueberfluessig machte). Er
      # bekaeme nie die vier Pflicht-Checks und bliebe fuer immer offen.
      #
      # Was der Marker "[skip ci]" hier einmal anrichtete, bleibt der Grund,
      # ihn nie zurueckzuholen: GitHub ueberspringt daraufhin JEDEN Workflow
      # fuer den Commit, auch das Release. Genau so ging v0.6.0 verloren, und
      # das Ruleset "release-tags" laesst Tags nicht verschieben.
      #
      # Die Aufnahme kommt jetzt im Pull Request des Menschen mit, der die
      # Ausgabe geaendert hat (CONTRIBUTING.md). Das altert nicht still:
      # tests/test_tape.py haelt docs/renders/demo.ascii gegen einen frischen
      # Lauf der CLI und wird rot, sobald das Bild etwas zeigt, was das
      # Programm nicht mehr ausgibt. Der Schritt "Mitschnitt gegen die echte
      # CLI halten" weiter oben faehrt genau diesen Test.
