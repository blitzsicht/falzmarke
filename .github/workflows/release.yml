name: Release

on:
  push:
    tags: ["v*"]
  # Nachfahrbar von Hand. Anlass: v0.6.0 wurde auf einen Commit gesetzt, dessen
  # Nachricht "[skip ci]" trug — von der GIF-Aufzeichnung, die auf main
  # zurueckschreibt. GitHub ueberspringt daraufhin JEDEN Workflow fuer diesen
  # Commit, auch diesen hier. Das Ruleset "release-tags" laesst Tags weder
  # verschieben noch loeschen; ohne manuellen Ausloeser waere das Release
  # unwiederbringlich verloren gewesen.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, fuer den das Release gebaut wird (z. B. v0.6.0)"
        required: true
        type: string

# Voreinstellung fuer alle Jobs: nur lesen. Wer mehr braucht,
# sagt es im Job — sichtbar und begrenzt.
permissions:
  contents: read

jobs:
  skill-paket:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Release anlegen und Asset anhaengen
      id-token: write        # OIDC fuer die Herkunftsbestaetigung
      attestations: write    # die Bestaetigung selbst schreiben
    steps:
      # Die Eingabe kommt von einem Menschen und wird nie in eine Shell
      # interpoliert — sie geht ueber die Umgebung, sonst waere jeder Ausloeser
      # eine Befehlseinschleusung.
      - name: Eingabe pruefen
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) echo "Tag: $TAG" ;;
            *) echo "FEHLER: '$TAG' ist kein Versions-Tag"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Skill packen
        # Dasselbe Skript laeuft lokal vor dem Release. Wer die Schritte hier
        # ausschreibt, hat zwei Fassungen, und die im Workflow laesst sich vor
        # dem Tag nicht ausprobieren (#122).
        run: bash scripts/skill_packen.sh

      - name: Pruefsumme bilden
        id: hash
        run: |
          sha256sum falzmarke.skill | tee falzmarke.skill.sha256
          echo "sha256=$(cut -d' ' -f1 falzmarke.skill.sha256)" >> "$GITHUB_OUTPUT"

      # Belegt Herkunft und Bauweg der Datei — nicht ihre Fehlerfreiheit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: falzmarke.skill

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            falzmarke.skill
            falzmarke.skill.sha256
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            **falzmarke.skill**
            `SHA-256: ${{ steps.hash.outputs.sha256 }}`

            Herkunft pruefen — belegt, aus welchem Lauf und welchem Commit die Datei stammt:

            ```bash
            gh attestation verify falzmarke.skill --repo blitzsicht/falzmarke
            ```

  pypi:
    # Der einzige Job im Repo, dessen Wirkung sich nicht zuruecknehmen laesst.
    #
    # Eine hochgeladene Version kann zurueckgezogen (geyankt), aber nie geloescht
    # und nie durch eine andere Datei mit derselben Nummer ersetzt werden. Und
    # der Paketname bleibt dauerhaft belegt — auch nach dem Loeschen des Projekts
    # gibt PyPI ihn nicht wieder frei.
    #
    # Deshalb drei Bremsen, von denen jede allein reichen wuerde:
    #   1. `environment: pypi` traegt required_reviewers — GitHub haelt den Job
    #      an und wartet auf eine Freigabe von Hand, auch nach dem Tag.
    #   2. Die Deployment-Branch-Policy laesst nur Tags `v*` zu.
    #   3. `needs: skill-paket` — laeuft erst, wenn das Release selbst steht.
    #
    # Kein API-Token: Die Anmeldung laeuft ueber OIDC (Trusted Publishing), der
    # Lauf weist sich mit einem kurzlebigen Token aus, das PyPI gegen die
    # hinterlegte Kombination aus Repository, Workflow-Datei und Environment
    # prueft. Ein Geheimnis, das es nicht gibt, kann nicht abfliessen.
    name: Auf PyPI veroeffentlichen (unumkehrbar)
    needs: skill-paket
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write        # nur hierfuer: das OIDC-Token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Version im Tag und im Paket muessen uebereinstimmen
        shell: bash
        run: |
          # Sonst laege auf PyPI eine andere Version als im Release — und die
          # falsche liesse sich nicht mehr ersetzen.
          TAG="${{ inputs.tag || github.ref_name }}"
          PAKET=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Tag: $TAG   pyproject: $PAKET"
          [ "$TAG" = "v$PAKET" ] || { echo "FEHL: Tag und Paketversion weichen ab."; exit 1; }

      - name: Alles pruefen, was ohne Tag pruefbar ist
        run: |
          # Wortgleich derselbe Aufruf wie in ci.yml bei jedem Push (Issue #76).
          # Bis dahin standen die Schritte hier ausgeschrieben und liefen erst am
          # Tag zum ersten Mal — vier der fuenf Fehlschlaege der ersten
          # Veroeffentlichung fielen deshalb erst nach dem Freigabeklick auf.
          # Ein Skript statt zweier Schrittlisten: Eine Probe, die vom echten Job
          # abweichen kann, prueft irgendwann etwas anderes als das, was passiert.
          bash scripts/paket_pruefen.sh

      - name: Pruefsummen ausgeben
        run: |
          # Damit im Nachhinein belegbar ist, welche Datei hochgeladen wurde.
          #
          # NICHT nach dist/ schreiben: Die Publish-Action laedt das Verzeichnis
          # vollstaendig hoch. Ein `| tee dist/SHA256SUMS` an dieser Stelle hat
          # Lauf 32966455275 (v0.7.2, 26.08.2026) zu Fall gebracht:
          #
          #   Checking dist/falzmarke-0.7.2-py3-none-any.whl: PASSED
          #   Checking dist/SHA256SUMS: ERROR InvalidDistribution:
          #     Unknown distribution format: 'SHA256SUMS'
          #
          # Der Beleg geht nicht verloren — er steht hier im Protokoll, und die
          # Action gibt die Hashes mit `print-hash: true` selbst noch einmal aus.
          sha256sum dist/*

      # AUSNAHME von der Hausregel "Actions auf Commit-SHAs pinnen" — begruendet,
      # nicht vergessen. Diese Action laeuft als Docker-Container und zieht ihr
      # Image mit dem `action_ref` als Image-Tag. Beim SHA-Pinning ist das der
      # Commit-SHA, und dafuer existiert im Registry kein Image: Sie werden nur
      # fuer Release-Tags gebaut. Gemessen am 26.08.2026 gegen ghcr.io:
      #
      #   v1.14.2                                    HTTP 200
      #   a892a5a61159132606e93a2fa6f4358831b04d26   manifest unknown
      #
      # Der Lauf 32965096295 ist genau daran gescheitert — nach der Freigabe,
      # aber vor jedem Upload. Der Tag v1.14.2 zeigt auf denselben Commit
      # a892a5a; wer das SHA-Pinning wiederherstellen will, muss vorher pruefen,
      # ob die Action ihr Image inzwischen unter dem SHA ablegt.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          print-hash: true
