name: Roadmap

# Bewusst **kein** push-Auslöser: Wöchentlich plus von Hand genügt für eine
# Seite, die sich mit der Planung ändert, nicht mit jedem Commit.
#
# Dieser Job schrieb bis zum 30.08.2026 auf main zurück und brauchte deshalb
# einen Schleifenschutz. Dafür stand einmal "[skip ci]" im Bot-Commit von
# ci.yml — und genau das hat v0.6.0 fast gekostet: GitHub überspringt
# daraufhin JEDEN Workflow für den Commit, auch das Release (siehe Kommentar
# in release.yml). Geschrieben wird hier nichts mehr (Issue #188); die
# erzeugte Seite liegt als Artefakt bereit.
on:
  schedule:
    - cron: "17 6 * * 1"     # montags 06:17 UTC
  workflow_dispatch:

# Voreinstellung für alle Jobs: nur lesen. Wer mehr braucht,
# sagt es im Job — sichtbar und begrenzt.
permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    permissions:
      issues: read           # Meilensteine und offene Issues lesen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Roadmap aus den Issues erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/roadmap.py

      - name: Abweichung melden, falls sich etwas geändert hat
        run: |
          # Bis zum 30.08.2026 committete dieser Schritt die Seite direkt auf
          # main. Damit konnte das Ruleset `main` nie auf `active` — es gilt
          # für alle Akteure ohne Bypass, und die Actions-App lässt sich auf
          # Repo-Ebene nicht als Bypass eintragen (422, Issue #188).
          #
          # Die Seite trägt bewusst kein Standdatum. Ohne eines meldet sich
          # dieser Schritt nur, wenn sich an der Planung wirklich etwas
          # geändert hat — sonst gäbe es jede Woche einen Treffer ohne Inhalt.
          if git diff --quiet -- docs/ROADMAP.md; then
            echo "Roadmap unverändert — nichts zu tun." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Die Roadmap ist veraltet"
            echo
            echo "\`docs/ROADMAP.md\` weicht von den Issues ab. Die neue Fassung"
            echo "liegt als Artefakt \`roadmap\` an diesem Lauf — herunterladen und"
            echo "in einen Pull Request aufnehmen."
            echo
            echo '```diff'
            git diff -- docs/ROADMAP.md | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Erzeugte Seite als Artefakt ablegen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roadmap
          path: docs/ROADMAP.md
          if-no-files-found: error
