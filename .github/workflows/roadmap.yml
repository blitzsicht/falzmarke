name: Roadmap

# Bewusst **kein** push-Auslöser. Dieser Job schreibt auf main zurück; auf push
# gestellt würde er sich selbst auslösen und bräuchte einen Schleifenschutz.
# Genau dafür stand bisher "[skip ci]" im Bot-Commit von ci.yml — und genau das
# hat v0.6.0 fast gekostet: GitHub überspringt daraufhin JEDEN Workflow für den
# Commit, auch das Release (siehe Kommentar in release.yml). Wöchentlich plus
# von Hand braucht den Schutz nicht.
on:
  schedule:
    - cron: "17 6 * * 1"     # montags 06:17 UTC
  workflow_dispatch:

# Voreinstellung für alle Jobs: nur lesen. Wer mehr braucht,
# sagt es im Job — sichtbar und begrenzt.
permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # die erzeugte Seite zurückschreiben
      issues: read           # Meilensteine und offene Issues lesen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Roadmap aus den Issues erzeugen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/roadmap.py

      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          # Die Seite trägt bewusst kein Standdatum. Ohne eines gibt es hier nur
          # dann einen Commit, wenn sich an der Planung wirklich etwas geändert
          # hat — sonst stünde jede Woche ein leerer Commit in der Geschichte.
          if git diff --staged --quiet; then
            echo "Roadmap unverändert — nichts zu committen."
          else
            git commit -m "Roadmap aus den Issues aktualisiert"
            git push
          fi
