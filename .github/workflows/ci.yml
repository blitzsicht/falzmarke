name: CI

on:
  push:
    branches: [main]
  pull_request:

# Voreinstellung fuer alle Jobs: nur lesen. Wer mehr braucht,
# sagt es im Job — sichtbar und begrenzt.
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r skill/requirements.txt pytest
          # Das MCP-SDK ist optional (pyproject: falzmarke[mcp]). Ohne es hier
          # zu installieren, würden die Server-Tests still übersprungen — und
          # ein übersprungener Test belegt nichts.
          pip install 'mcp>=2,<3'

      - name: Keine AGPL-Abhängigkeit
        shell: bash
        run: |
          # PyMuPDF ist AGPL-3.0 oder kommerziell. Wäre es installiert, könnte
          # ein Import unbemerkt zurückkehren und die Lizenzlage der ganzen
          # Auslieferung ändern, ohne dass ein Test rot wird.
          if pip show pymupdf >/dev/null 2>&1; then
            echo "PyMuPDF ist installiert — es darf keine Abhängigkeit von falzmarke sein."
            exit 1
          fi
          # Gesucht wird der Rueckfall, nicht das Wort. Bis zum 27.08.2026 stand
          # hier ein `grep "pymupdf"` ueber ganze Dateien — case-sensitiv. Dass
          # der Docstring von geometrie.py seit v0.4 "PyMuPDF" erwaehnt, ohne
          # rot zu werden, war reiner Zufall der Schreibweise; ein echter
          # Rueckfall als `import PyMuPDF` waere durchgekommen. Und eine
          # Pruefung, die das Wort verbietet, verbietet auch, den Grund
          # aufzuschreiben — dann holt es beim naechsten Mal jemand zurueck.
          if grep -rniE "^[[:space:]]*(import|from)[[:space:]]+(fitz|pymupdf)([[:space:]]|\.|$)" --include="*.py" .; then
            echo "PyMuPDF wird importiert — es darf keine Abhängigkeit von falzmarke sein."
            exit 1
          fi
          if grep -rniE "^[[:space:]]*[\"']?pymupdf" --include="*.txt" --include="*.toml" .; then
            echo "PyMuPDF steht als Abhängigkeit."
            exit 1
          fi
          echo "OK  keine AGPL-Abhängigkeit"

      - name: Tests
        run: python -m pytest -q -p no:warnings

      - name: Beispiele rendern
        shell: bash
        run: |
          # Relativer Pfad statt /tmp — den gibt es auf Windows-Runnern nicht.
          mkdir -p docs/renders bau
          for datei in examples/*.md; do
            name=$(basename "$datei" .md)
            python skill/scripts/falzmarke.py render "$datei" -o "bau/$name.pdf"
            python skill/scripts/falzmarke.py preview "$datei" -o "docs/renders/$name.png" --ppi 110
          done

      - name: E-Mail-Beispiele setzen
        shell: bash
        run: |
          # Der Byte-Vergleich gegen die Goldens läuft in pytest. Hier geht es
          # um den Weg über die Kommandozeile: dass der Befehl auf allen drei
          # Plattformen dieselben Dateien schreibt und `verify --email` grün
          # meldet. Ohne SOURCE_DATE_EPOCH — eine Nachricht ohne `Date` ist der
          # Normalfall, und genau der soll hier laufen.
          for datei in examples/email/*.md; do
            name=$(basename "$datei" .md)
            python skill/scripts/falzmarke.py email "$datei" -o "bau/$name" --html --txt
            test -f "bau/$name.eml" && test -f "bau/$name.html" && test -f "bau/$name.txt"
            python skill/scripts/falzmarke.py verify "bau/$name.eml" --email
          done
          echo "gesetzt: $(ls bau/*.eml | wc -l) Nachrichten"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: renders-${{ matrix.os }}
          path: docs/renders/

  frischklon:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Alles pruefen, was ohne Tag pruefbar ist
        run: |
          # Derselbe Aufruf wie in release.yml vor dem Upload (Issue #76).
          # Der Release-Job lief bisher erst am Tag zum ersten Mal vollstaendig,
          # und jeder Fehlschlag kostete eine Versionsnummer, die niemand je
          # wieder verwenden kann. Jetzt laeuft er bei jedem Push mit.
          bash scripts/paket_pruefen.sh

      - name: Das gebaute Wheel ohne Clone installieren
        run: |
          python -m venv /tmp/frisch
          /tmp/frisch/bin/pip install dist/*.whl

      - name: Befehle aus der README ausführen
        run: |
          # Der Beweis, dass die README nicht etwas verspricht, was es nicht gibt.
          mkdir -p /tmp/arbeit && cd /tmp/arbeit
          /tmp/frisch/bin/falzmarke --version
          /tmp/frisch/bin/falzmarke init brief.md --profil example --betreff "Probe"
          printf 'dieser Brief entstand ohne Clone.\n' >> brief.md
          /tmp/frisch/bin/falzmarke lint brief.md
          /tmp/frisch/bin/falzmarke render brief.md --png
          /tmp/frisch/bin/falzmarke verify brief.pdf
          test -f brief.pdf && test -f brief.png

  skill-paket:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Skill-Paket bauen
        run: |
          # Derselbe Aufruf wie in release.yml (Issue #122). Der Pack-Schritt
          # lief bisher erst am Tag zum ersten Mal, und das Ruleset laesst Tags
          # weder verschieben noch loeschen — ein Fehlschlag dort kostet eine
          # Versionsnummer. Jetzt laeuft er bei jedem Push mit.
          bash scripts/skill_packen.sh

      - name: Der Renderer kommt ohne PyPI zustande
        run: |
          # Der gemeldete Fall, nachgestellt: Eine Analyse-Sandbox bringt die
          # vier verbreiteten Pakete mit, typst nicht — und hat kein PyPI.
          # Nur hier laesst sich das pruefen: Das mitgelieferte Wheel ist fuer
          # manylinux gebaut und auf keiner anderen Plattform installierbar.
          mkdir -p /tmp/sandbox && cd /tmp/sandbox
          unzip -q "$GITHUB_WORKSPACE/falzmarke.skill"
          python -m venv v
          v/bin/pip install --quiet pyyaml pdfplumber pypdf markdown-it-py

          # Vorbedingung sichtbar machen: typst fehlt wirklich. Ohne diese
          # Zeile bewiese ein gruener Lauf nur, dass typst schon da war.
          if v/bin/python -c "import typst" 2>/dev/null; then
            echo "FEHL: typst war schon installiert — der Test misst nichts."; exit 1
          fi

          # Ab hier ist PyPI unerreichbar.
          export PIP_INDEX_URL=http://127.0.0.1:1/simple PIP_RETRIES=0 PIP_TIMEOUT=1
          v/bin/python falzmarke/scripts/bootstrap.py
          v/bin/python -c "import typst; print('typst aus dem Paket:', typst.__file__)"

      - name: Gegenprobe — ohne das Wheel scheitert derselbe Lauf
        run: |
          # Ohne sie belegt der Schritt davor nur, dass er gruen ist.
          cd /tmp/sandbox
          v/bin/pip uninstall -y --quiet typst
          rm -f falzmarke/vendor/*.whl
          export PIP_INDEX_URL=http://127.0.0.1:1/simple PIP_RETRIES=0 PIP_TIMEOUT=1
          if v/bin/python falzmarke/scripts/bootstrap.py; then
            echo "FEHL: bootstrap meldete Erfolg ohne Wheel und ohne Netz."; exit 1
          fi
          echo "OK  Ohne Wheel und ohne Netz bricht bootstrap ab, wie vorgesehen."

  pdf-konformitaet:
    # Der einzige Job, dessen Urteil NICHT aus dieser Codebasis stammt.
    #
    # Alle anderen Prüfungen hier messen mit demselben Code, der das PDF
    # erzeugt hat — sie belegen Selbsttreue, keine Konformität. veraPDF ist die
    # Referenzimplementierung der PDF Association, hat den Brief nicht
    # geschrieben und teilt keine Zeile mit dem Renderer. Erst damit steht
    # hinter der Konformitätsaussage im README ein fremder Beleg (Issue #34).
    #
    # Nur ubuntu: Der Beleg hängt am Prüfergebnis, nicht am Betriebssystem des
    # Prüfers. Dieselbe Datei dreimal zu validieren wäre dreimal dasselbe
    # Urteil — die Plattform-Matrix in `tests` deckt ab, dass die Datei überall
    # gleich entsteht.
    name: PDF-Konformität (veraPDF, fremdes Werkzeug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r skill/requirements.txt pytest

      - name: veraPDF installieren
        run: |
          # Java bringt der Runner mit; ein eigener setup-java-Schritt wäre eine
          # weitere Action, die gepinnt und gepflegt werden müsste.
          java -version
          curl -sSL --retry 3 -o /tmp/verapdf-installer.zip \
            https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-installer
          cd /tmp/verapdf-installer/verapdf-greenfield-*
          cat > auto-install.xml <<'XML'
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>/opt/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
              <pack index="2" name="veraPDF Validation model" selected="false"/>
              <pack index="3" name="veraPDF Documentation" selected="false"/>
              <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          ./verapdf-install ./auto-install.xml
          echo "/opt/verapdf" >> "$GITHUB_PATH"

      - name: veraPDF ist wirklich da
        run: |
          # Ohne diesen Schritt liefe der nächste in "NICHT GEPRÜFT" (Exit 2)
          # und würde den Job zwar rot machen — aber die Ursache stünde erst
          # tief in der Ausgabe. Hier steht sie oben.
          command -v verapdf
          verapdf --version 2>&1 | grep -iE "veraPDF|[0-9]+\.[0-9]+" | head -2

      - name: Beispiele rendern
        run: |
          mkdir -p bau
          for datei in examples/*.md; do
            python skill/scripts/falzmarke.py render "$datei" -o "bau/$(basename "$datei" .md).pdf"
          done
          echo "gerendert: $(ls bau/*.pdf | wc -l)"

      - name: Konformität gegen ein fremdes Werkzeug halten
        run: |
          # --gegenprobe erzeugt zusätzlich ein PDF OHNE PDF/A und verlangt,
          # dass veraPDF es ablehnt. Ohne sie belegt ein grüner Lauf nur, dass
          # veraPDF gestartet ist.
          python scripts/pdf_konformitaet.py bau/*.pdf --gegenprobe examples/brief-form-b.md

      - name: Tests der Prüfung selbst
        run: python -m pytest tests/test_pdf_konformitaet.py -o addopts="" -q

  renders-aktualisieren:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: renders-ubuntu-latest
          path: docs/renders/
      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/renders/
          if git diff --staged --quiet; then
            echo "OK  Renders unveraendert — nichts zu committen."
            exit 0
          fi
          git commit -m "Renders aktualisiert [skip ci]"

          # Wettrennen (Issue #85): Dieser Job wartet ueber `needs: tests` auf die
          # ganze Testmatrix. In dieser Zeit laeuft `main` regelmaessig weg, und ein
          # blankes `git push` prallt ab — gemessen am 27.08.2026 in 14 von 30 Laeufen
          # auf main. In Pull Requests faellt es nie auf, weil der Job dort per `if`
          # gar nicht laeuft.
          #
          # Nachgestellt vor dem Einbau: flacher Klon (fetch-depth 1, wie actions/
          # checkout per Default liefert), origin drei Commits voraus. Blankes `push`
          # scheitert mit genau der Meldung aus dem Log; `pull --rebase` holt die
          # fehlende Historie selbst nach und der Push geht durch. Ein
          # `fetch-depth: 0` ist dafuer nicht noetig und wuerde nur den Klon aufblaehen.
          #
          # Die Schleife deckt den Fall ab, dass zwischen `pull` und `push` erneut
          # jemand schreibt. `[skip ci]` steht in der Nachricht, eine Endlosschleife
          # aus wiederholten Laeufen kann daraus also nicht entstehen.
          for versuch in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "OK  gepusht (Versuch $versuch)"
              exit 0
            fi
            echo "Push abgeprallt — jemand war schneller. Neuer Versuch."
            sleep 5
          done
          echo "FEHL: nach drei Versuchen nicht durchgekommen."
          exit 1
