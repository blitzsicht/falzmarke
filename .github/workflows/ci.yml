name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r skill/requirements.txt pytest

      - name: Keine AGPL-Abhängigkeit
        shell: bash
        run: |
          # PyMuPDF ist AGPL-3.0 oder kommerziell. Wäre es installiert, könnte
          # ein Import unbemerkt zurückkehren und die Lizenzlage der ganzen
          # Auslieferung ändern, ohne dass ein Test rot wird.
          if pip show pymupdf >/dev/null 2>&1; then
            echo "PyMuPDF ist installiert — es darf keine Abhängigkeit von normbrief sein."
            exit 1
          fi
          if grep -rn "pymupdf\|import fitz" --include="*.py" --include="*.txt" --include="*.toml" .; then
            echo "PyMuPDF wird im Code referenziert."
            exit 1
          fi
          echo "OK  keine AGPL-Abhängigkeit"

      - name: Tests
        run: python -m pytest -q -p no:warnings

      - name: Beispiele rendern
        run: |
          mkdir -p docs/renders
          for datei in examples/*.md; do
            name=$(basename "$datei" .md)
            python skill/scripts/normbrief.py render "$datei" -o "/tmp/$name.pdf"
            python skill/scripts/normbrief.py preview "$datei" -o "docs/renders/$name.png" --ppi 110
          done

      - uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: docs/renders/

  renders-aktualisieren:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: renders-ubuntu-latest
          path: docs/renders/
      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/renders/
          git diff --staged --quiet || git commit -m "Renders aktualisiert [skip ci]"
          git push
